# Reusable workflow - quality gate.
# fmt · tidy · vet · lint (golangci-lint via go tool) · vuln-check ·
# Dockerfile checks. Called by ci.yml. Must pass before push; does NOT gate
# coverage, trivy, or smoke (those only need validate-test.yml). Mirrors the
# sibling IAM services' validate-quality.yml.
name: Validate / Quality

"on":
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to check out (leave empty to use the caller ref)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Set up Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            go.mod

      - name: Configure private module access
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GO_PRIVATE_TOKEN }}@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials

      - name: Download modules
        env:
          GOPRIVATE: github.com/BCBP-SOLUTIONS-FZC-LLC/*
          GONOSUMDB: github.com/BCBP-SOLUTIONS-FZC-LLC/*
        run: go mod download

      - name: Verify modules
        run: go mod verify

      # Workflow files must use literal operators, not HTML entity encodings.
      - name: Reject HTML-escaped operators in workflow files
        run: |
          if grep -REn '&(gt|lt|amp)' .github/workflows/ .github/scripts/; then
            echo "::error::Workflow or script files contain HTML entities. Use literal operators instead."
            exit 1
          fi

      # RLS-6 CI gate (§6.2/§13.1/§14/§17.5 Case 5): reject any
      # non-transaction-local write to the app.tenant_id GUC in Go/SQL
      # source. The only legitimate way to bind the tenant GUC in this
      # service is via platform-pgcommon's GUCSetFromContext / WithGUCSet,
      # which issues "SELECT set_config('app.tenant_id', $1, true)" -
      # transaction-local (is_local=true) - inside a transaction. A
      # session-scoped SET would persist across pooled backends and leak
      # across tenants under PgBouncer-style connection reuse (exactly
      # what TestRLS_Case5_NoGUCLeakageAcrossPooledConnection guards
      # against). Migrations live under
      # internal/adapter/outbound/postgres/migrations - already covered
      # by scanning internal/. Inlined here (not a standalone script)
      # matching the sibling IAM services' convention.
      - name: Reject non-transaction-local SET app.tenant_id
        run: |
          hits=$(grep -REn '\bSET[[:space:]]+("?app\.tenant_id"?)[[:space:]]*=' \
                   --include='*.go' --include='*.sql' \
                   cmd/ internal/ 2>/dev/null | grep -v 'SET LOCAL' | grep -v 'set_config' || true)
          if [ -n "$hits" ]; then
            echo "::error::Non-transaction-local SET app.tenant_id detected. Use pgcommon.WithGUCSet / GUCSetFromContext, which emits SELECT set_config('app.tenant_id', \$1, true) inside a transaction (SET LOCAL semantics)."
            echo "$hits"
            exit 1
          fi
          echo "Tenant GUC binding check passed - no forbidden non-LOCAL SET app.tenant_id found."

      # Enterprise Platform Observability Standard: every registered
      # Prometheus collector must follow the platform_*/iam_*/
      # iam_realm_provisioner_* naming hierarchy, the _total/_seconds
      # suffix rules, the centrally-injected domain/service/environment
      # label rules, and (platform_* only) this service's Platform
      # Observability Registry compliance/label-vocabulary rules - see
      # .github/scripts/check-metric-naming.sh for the full rationale.
      - name: Metric naming convention check
        run: bash .github/scripts/check-metric-naming.sh

      # platform-gincommon's own metricslint: registry compliance and label
      # vocabulary on a real scrape, legacy/unregistered names in alert
      # rules, dashboards and runbooks, and docs/observability/
      # metric-registry.md in sync with the code (matches iam-org-membership).
      - name: Observability standard lint (metricslint)
        run: bash .github/scripts/metricslint.sh

      # Regenerates docs/swagger/{docs.go,swagger.json,swagger.yaml} from
      # the current @Summary/@Router handler annotations and fails if that
      # produces a diff — the same drift this caught locally once already
      # (RP-17/RP-18 shipped without a regenerate-and-commit). Matches
      # make swag-check's own script; not previously wired into any
      # workflow.
      - name: Swagger staleness check
        run: bash .github/scripts/check-swagger-stale.sh

      - name: Format check
        run: |
          unformatted=$(gofmt -l cmd/ internal/ pkg/ test/ 2>/dev/null || true)
          if [ -n "${unformatted}" ]; then
            echo "${unformatted}" | while IFS= read -r f; do
              echo "::error file=${f},title=Format check::Not formatted - run 'make fmt'"
            done
            exit 1
          fi

      - name: Tidy check
        run: |
          make tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error file=go.mod,title=Module drift::go.mod or go.sum is stale - run 'go mod tidy' and commit the result."
            exit 1
          fi

      - name: Vet
        run: make vet

      - name: Lint
        run: make lint

      - name: Vulnerability check
        run: |
          if ! make vuln-check; then
            echo "::error file=go.mod,title=Vulnerability found::govulncheck detected vulnerabilities - run 'make vuln-check' locally to view details."
            exit 1
          fi

      # Enforce digest-pinned FROM lines in the Dockerfile. Floating tags
      # (e.g. golang:1.26.9-bookworm without @sha256:...) can be silently
      # overwritten by upstream maintainers, breaking supply-chain
      # guarantees.
      - name: Dockerfile base image digest check
        run: |
          if grep -E '^FROM [^ @]+:[^ @]+( AS .+)?$' Dockerfile; then
            echo "::error file=Dockerfile,title=Unpinned base image::Dockerfile FROM lines must use digest-pinned references (e.g. golang:1.26.9-bookworm@sha256:...)."
            exit 1
          fi
          echo "Dockerfile base images are digest-pinned."
