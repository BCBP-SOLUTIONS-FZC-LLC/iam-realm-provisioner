# Reusable workflow - test gate.
# Race detector (unit · postgres/RLS · integration) + coverage + arch lint +
# AsyncAPI-vs-schema drift check + e2e — all in one `test` job, matching
# iam-tender-acl's single-job structure. Called by ci.yml and release.yml,
# so both share exactly one definition of "tests pass".
name: Validate / Test

"on":
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to check out (leave empty to use the caller ref)'
        type: string
        required: false
        default: ''
    outputs:
      pct:
        description: 'Total statement coverage percentage'
        value: ${{ jobs.test.outputs.pct }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # 95% - matches coverage-gate.sh's own default (kept explicit here so the
  # threshold is visible without reading both files). A prior pass judged
  # cmd/server/main.go/cmd/reconciler/main.go's run() unreachable without a
  # live Postgres/Keycloak/AWS connection; composition-root integration
  # tests (cmd/server/main_integration_test.go, cmd/reconciler/
  # main_integration_test.go) proved otherwise, using signal.Notify's
  # pre-empt-default-terminate behavior to safely signal-test main() in
  # process against a real testcontainers Postgres. That took the measured
  # merged total to ~97.8%. 95% leaves headroom below the measured number
  # for testcontainer-run variance without masking a real regression.
  # Ratchet this up over time as more tests are added; never lower it to
  # make a failing PR pass.
  COVERAGE_THRESHOLD: '95'

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    # unit + postgres/RLS + integration (race + coverage): ~10 min
    # arch-lint + metrics-registry-lint: ~1 min
    # pre-pull Keycloak 26 image: ~2 min
    # e2e (real Postgres + Keycloak testcontainers): ~10 min
    timeout-minutes: 30
    outputs:
      pct: ${{ steps.gate.outputs.pct }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            go.mod

      - name: Configure private module access
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GO_PRIVATE_TOKEN }}@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials

      - name: Download modules
        env:
          GOPRIVATE: github.com/BCBP-SOLUTIONS-FZC-LLC/*
          GONOSUMDB: github.com/BCBP-SOLUTIONS-FZC-LLC/*
        run: go mod download

      # Every private module is resolved by `go mod download` above — no
      # later step in this job needs network/credential access again, so
      # the plaintext token doesn't need to sit on disk for the rest of the
      # job. `if: always()` so this still runs (and the token is still
      # removed) even if `go mod download` itself failed.
      - name: Remove private module credentials
        if: always()
        run: |
          rm -f ~/.git-credentials
          git config --global --unset credential.helper || true

      - name: Verify modules
        run: go mod verify

      # Mandatory blocking gate: runs unit (incl. the AsyncAPI-vs-eventschema
      # drift test, internal/eventschema/asyncapi_drift_test.go - this
      # service's CI-enforceable substitute for a live Glue-registry
      # comparison, §7.3/§25) + postgres/RLS (Testcontainers Postgres) +
      # integration (Testcontainers Postgres+Keycloak) with -race and
      # coverage, in parallel, merged into coverage.out (§17 Testing
      # Strategy). Any data race detected here blocks all downstream jobs
      # (build-image). Do NOT remove or skip.
      - name: Tests - unit · postgres/RLS · integration (race + coverage)
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'
        run: make test-ci

      - name: Coverage threshold gate
        id: gate
        run: bash .github/scripts/coverage-gate.sh

      - name: Upload coverage report
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: coverage-report-${{ github.sha }}
          path: coverage.out
          if-no-files-found: ignore
          retention-days: 30

      # Enforces this service's Clean Architecture layering (defined in
      # .go-arch-lint.yml, §3.4/§6): core/domain -> core/port -> core/service,
      # adapter/inbound and adapter/outbound depending only on core (+
      # eventschema/api/observability), never on each other - wired together
      # only from cmd/server and cmd/reconciler. Also enforces RP-INV-1
      # (single Keycloak writer) and RLS-6 (no session-scoped tenant GUC).
      - name: Cache go-arch-lint binary
        uses: actions/cache@v6.1.0
        with:
          path: ~/go/bin
          key: go-arch-lint-${{ runner.os }}-v1.15.0

      - name: Architecture lint
        run: bash .github/scripts/arch-lint.sh

      # Enforces the Enterprise Platform Observability Standard against the
      # central Platform Observability Registry (platform-gincommon
      # pkg/obsregistry): no removed metric name in the rule/HPA/adapter
      # files, and every alert reading a "proposed" metric carries
      # metric_status: proposed.
      - name: Metrics registry compliance lint
        run: bash .github/scripts/metrics-registry-lint.sh

      # Regenerates docs/swagger/{docs.go,swagger.json,swagger.yaml} from
      # the current handler annotations and fails if that produces a diff —
      # ensures committed Swagger docs stay in sync with the code.
      - name: Swagger staleness check
        run: bash .github/scripts/check-swagger-stale.sh

      - name: Set up Python (schema-gov)
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # platform-schemagov is installed from source, not pulled from GHCR:
      # the ghcr.io package's Actions-access allow-list doesn't include this
      # repo. GO_PRIVATE_TOKEN authorizes the git clone. Same as schema-registry.yml.
      - name: Install schema-gov (platform-schemagov v0.4.0)
        run: |
          pip install --no-cache-dir "git+https://x-access-token:${{ secrets.GO_PRIVATE_TOKEN }}@github.com/BCBP-SOLUTIONS-FZC-LLC/platform-schemagov.git@v0.4.0"

      # Verifies that the JSON schemas embedded in internal/eventschema/
      # match what api/asyncapi.yaml declares — the CI-enforceable counterpart
      # of the asyncapi_drift_test.go Go test. Fails if any schema file is
      # missing, extra, or out of sync with the AsyncAPI channel messages.
      - name: Event schema sync check
        run: |
          schema-gov extract \
            --asyncapi   api/asyncapi.yaml \
            --schema-dir internal/eventschema \
            --check

      # Pull the two images up front so their download time is not charged
      # against the suite's container-start waits (Keycloak's is 120s).
      - name: Pre-pull container images
        run: |
          docker pull postgres:16-alpine
          docker pull quay.io/keycloak/keycloak:26.0

      # Drives the production route table (internal/adapter/inbound/http.NewRouter,
      # the exact construction cmd/server wires) over real HTTP against a real
      # Postgres and a real Keycloak 26 testcontainer: trial provision →
      # conversion, IdP configure behind the §11.6 gate, suspend → reactivate,
      # idempotency replay (test/e2e's package doc has the full scope). The suite
      # starts its own containers. Not part of the coverage gate, but must pass
      # before any downstream job builds on this ref.
      - name: End-to-end tests
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'
        run: make test-e2e
