asyncapi: 3.0.0

info:
  title: IAM Realm Provisioner Events
  version: "1.0.0"
  description: |
    Domain events published and consumed by iam-realm-provisioner (LLD §7).

    This service is BOTH a producer and a consumer. It publishes NINE
    tenant-lifecycle events on the `iam-tenant-events` SNS topic — the one
    IAM topic with two producers (this service and Org & Membership,
    HLD §9.1.1). It shares the topic's Glue Schema Registry
    (`iam-tenant-events`) with Org & Membership, which registers
    TenantCreated/TrialStarted there — the two producers never collide on
    schema names (RP-D5).

    It consumes three SQS queues:
      membership-realm-q  ← iam.membership.events (O&M)  — MFA-role sync
      tenant-realm-q       ← iam.tenant.events (O&M)       — trial timer record
      billing-realm-q      ← billing.events (Billing)      — reactivation

    Downstream consumers of iam.tenant.events (Commercial domain, CD-26):
    These queues are subscribed to the shared iam-tenant-events SNS topic by
    Commercial domain services — they are NOT consumed by this service. Listed
    here for cross-team visibility (CD-24, CD-6, CD-26):
      tenant-billing-q     → Billing      — filter: TenantSuspended, TenantReactivated
                             Billing monitors operator suspensions (CD-24) and
                             operator un-suspends to decide subscription handling.
      tenant-entitlements-q → Entitlements — filter: TenantConverted, TenantSuspended,
                             TenantReactivated, TenantOffboarded, TrialExpired (CD-6)
                             Entitlements recomputes effective entitlement state on
                             every tenant-lifecycle change.
      tenant-usage-q       → Usage & Metering — filter: TenantConverted,
                             TenantSuspended, TenantOffboarded
                             Usage & Metering starts a fresh period, stops rendering
                             limits, and purges raw usage on the respective events.

    Wire format: each SNS message body is prefixed with an 18-byte AWS Glue
    Schema Registry header before the EventEnvelope JSON:
      byte 0     : header version (0x03)
      byte 1     : compression    (0x00 = none)
      bytes 2-17 : schema version UUID

    `TenantReactivated` is a name this service both PRODUCES (source=operator,
    on iam.tenant.events, for an operator un-suspend) and CONSUMES (Billing's,
    source=billing, on billing.events → billing-realm-q). The two ride
    different topics, so there is no self-consumption (RP-D13).

    Schema versioning: the authoritative version identifier is the 16-byte
    UUID in the Glue wire-format header. The same UUID is echoed into the
    envelope JSON as `dataschema`. It is resolved once at startup by content
    — glue:GetSchemaByDefinition with the binary's own embedded schema — so
    every event carries the version that actually describes it, fixed for
    the life of the pod: registering a newer version does NOT change what
    running pods stamp (and an older build, e.g. after a rollback, keeps
    stamping its own). A pod whose schema definition isn't registered yet
    fails startup until schema-registry.yml registers it. In dev/test
    (NoopCodec) there is no Glue header and `dataschema` is absent.

    Consumed-message payloads (tagged `consumed` below) are validated against
    this service's own extracted schemas (internal/eventschema,
    eventschema.ConsumedByConsumer — keyed per queue, since
    `TenantReactivated` differs by producer) before the handler runs. A
    violation is never processed; it is retried until the queue's
    RedrivePolicy moves it to -dlq, and counted by
    iam_realm_provisioner_consumed_schema_violations_total.

  license:
    name: Proprietary

defaultContentType: application/json

tags:
  - $ref: '#/components/tags/published'
  - $ref: '#/components/tags/consumed'

servers:
  snsTenantEvents:
    host: "sns.ap-south-1.amazonaws.com"
    protocol: sns
    description: |
      The `iam-tenant-events` SNS topic (shared with Org & Membership,
      two-producer topic per HLD §9.1.1). This service publishes 10 of the
      12 schemas registered in the `iam-tenant-events` Glue registry.
    security:
      - $ref: '#/components/securitySchemes/iamRole'

  sqsMembershipRealm:
    host: "sqs.ap-south-1.amazonaws.com"
    protocol: sqs
    description: |
      Queue: membership-realm-q  |  DLQ: membership-realm-q-dlq  (maxReceiveCount=5)
      SNS subscription filter: EventType IN [DepartmentMembershipGranted,
        DepartmentMembershipLevelChanged, TenantRoleGranted, TenantRoleRevoked]
      Source topic: iam.membership.events (Org & Membership).

  sqsTenantRealm:
    host: "sqs.ap-south-1.amazonaws.com"
    protocol: sqs
    description: |
      Queue: tenant-realm-q  |  DLQ: tenant-realm-q-dlq  (maxReceiveCount=5)
      SNS subscription filter: EventType IN [TrialStarted]
      Source topic: iam.tenant.events (Org & Membership) — RP-4.

  sqsBillingRealm:
    host: "sqs.ap-south-1.amazonaws.com"
    protocol: sqs
    description: |
      Queue: billing-realm-q  |  DLQ: billing-realm-q-dlq  (maxReceiveCount=5)
      SNS subscription filter: EventType IN [TenantReactivated]
      Source topic: billing.events (Billing Service).

  # ── Downstream Commercial consumers of iam.tenant.events (CD-26) ─────────
  # These queues are owned by Commercial domain services and subscribe to the
  # shared iam-tenant-events SNS topic produced by this service. They are
  # documented here for cross-team visibility; this service does NOT consume them.

  sqsTenantBilling:
    host: "sqs.ap-south-1.amazonaws.com"
    protocol: sqs
    description: |
      Queue: tenant-billing-q  |  DLQ: tenant-billing-q-dlq  (maxReceiveCount=5)
      SNS subscription filter: EventType IN [TenantSuspended, TenantReactivated]
      Source topic: iam.tenant.events (this service).
      Owner: Billing Service (commercial namespace).
      Purpose (CD-24): Billing monitors operator suspensions (RP-14, source=operator)
      and operator un-suspends (RP-10, source=operator) to decide subscription state
      handling — previously these were invisible to Billing (CD-24).

  sqsTenantEntitlements:
    host: "sqs.ap-south-1.amazonaws.com"
    protocol: sqs
    description: |
      Queue: tenant-entitlements-q  |  DLQ: tenant-entitlements-q-dlq  (maxReceiveCount=5)
      SNS subscription filter: EventType IN [TenantConverted, TenantSuspended,
        TenantReactivated, TenantOffboarded, TrialExpired]
      Source topic: iam.tenant.events (this service).
      Owner: Entitlements Service (commercial namespace).
      Purpose: Entitlements invalidates its cached effective entitlement set on every
      tenant-lifecycle transition. TrialExpired is included per CD-6 so Entitlements
      reflects the suspended entitlement state when a trial expires.

  sqsTenantUsage:
    host: "sqs.ap-south-1.amazonaws.com"
    protocol: sqs
    description: |
      Queue: tenant-usage-q  |  DLQ: tenant-usage-q-dlq  (maxReceiveCount=5)
      SNS subscription filter: EventType IN [TenantConverted, TenantSuspended,
        TenantOffboarded]
      Source topic: iam.tenant.events (this service).
      Owner: Usage & Metering Service (commercial namespace).
      Purpose: Usage & Metering starts a fresh billing period on TenantConverted,
      stops rendering limits for a suspended tenant on TenantSuspended, and purges
      raw usage (keeping period totals) on TenantOffboarded.

channels:
  iamTenantEvents:
    address: "iam-tenant-events"
    servers:
      - $ref: '#/servers/snsTenantEvents'
    description: The shared iam.tenant.events SNS topic — this service's 10 published events.
    messages:
      TrialTenantProvisioned:
        $ref: '#/components/messages/TrialTenantProvisioned'
      TenantIdentityProvisioned:
        $ref: '#/components/messages/TenantIdentityProvisioned'
      TenantRealmReady:
        $ref: '#/components/messages/TenantRealmReady'
      TenantConverted:
        $ref: '#/components/messages/TenantConverted'
      DirectPaidSignup:
        $ref: '#/components/messages/DirectPaidSignup'
      TrialExpired:
        $ref: '#/components/messages/TrialExpired'
      TrialReactivated:
        $ref: '#/components/messages/TrialReactivated'
      TenantSuspended:
        $ref: '#/components/messages/TenantSuspended'
      TenantOffboarded:
        $ref: '#/components/messages/TenantOffboarded'
      TenantReactivated:
        $ref: '#/components/messages/TenantReactivated'

  membershipRealmQueue:
    address: "membership-realm-q"
    servers:
      - $ref: '#/servers/sqsMembershipRealm'
    description: |
      Drives MfaService.SyncRequiresMfa (§8.6). Adds requires-mfa
      unconditionally on grant/elevate; drops it only on TenantRoleRevoked,
      after an O&M I-8 residual-MFA-requirement check.
    messages:
      DepartmentMembershipGranted:
        $ref: '#/components/messages/DepartmentMembershipGranted'
      DepartmentMembershipLevelChanged:
        $ref: '#/components/messages/DepartmentMembershipLevelChanged'
      TenantRoleGranted:
        $ref: '#/components/messages/TenantRoleGranted'
      TenantRoleRevoked:
        $ref: '#/components/messages/TenantRoleRevoked'

  tenantRealmQueue:
    address: "tenant-realm-q"
    servers:
      - $ref: '#/servers/sqsTenantRealm'
    description: |
      Drives LifecycleService.RecordTrialTimer — idempotent upsert of
      trial_ends_at onto the existing tenant_realms row (RP-4). This
      service never queries O&M for trial data; it is push-only.
    messages:
      TrialStarted:
        $ref: '#/components/messages/TrialStarted'

  billingRealmQueue:
    address: "billing-realm-q"
    servers:
      - $ref: '#/servers/sqsBillingRealm'
    description: |
      Drives LifecycleService.ReactivateFromBilling (§8.11). Re-enables the
      dedicated realm only if it had reached `suspended`; otherwise a no-op
      (still recorded in processed_events).
    messages:
      BillingTenantReactivated:
        $ref: '#/components/messages/BillingTenantReactivated'

operations:
  sendTrialTenantProvisioned:
    action: send
    channel:
      $ref: '#/channels/iamTenantEvents'
    summary: RP-1 emits TrialTenantProvisioned on shared-trial user creation.
    messages:
      - $ref: '#/channels/iamTenantEvents/messages/TrialTenantProvisioned'

  sendTenantIdentityProvisioned:
    action: send
    channel:
      $ref: '#/channels/iamTenantEvents'
    summary: >-
      RP-1 (trial) and RP-2 (direct paid) emit TenantIdentityProvisioned once
      the tenant's admin user exists in Keycloak — the signup backstop (BFF-2)
      O&M consumes to run I-1 itself if the BFF never created the tenant.
      Enqueued first in the commit transaction (RP-2: before TenantRealmReady,
      DirectPaidSignup, TenantConverted); the topic is not FIFO, so consumers
      must tolerate any arrival order.
    messages:
      - $ref: '#/channels/iamTenantEvents/messages/TenantIdentityProvisioned'

  sendTenantRealmReady:
    action: send
    channel:
      $ref: '#/channels/iamTenantEvents'
    summary: RP-2 or RP-3 emits TenantRealmReady once a dedicated realm + OIDC clients exist.
    messages:
      - $ref: '#/channels/iamTenantEvents/messages/TenantRealmReady'

  sendTenantConverted:
    action: send
    channel:
      $ref: '#/channels/iamTenantEvents'
    summary: RP-3 (or RP-2 with direct_signup=true) emits TenantConverted.
    messages:
      - $ref: '#/channels/iamTenantEvents/messages/TenantConverted'

  sendDirectPaidSignup:
    action: send
    channel:
      $ref: '#/channels/iamTenantEvents'
    summary: RP-2 completion emits DirectPaidSignup.
    messages:
      - $ref: '#/channels/iamTenantEvents/messages/DirectPaidSignup'

  sendTrialExpired:
    action: send
    channel:
      $ref: '#/channels/iamTenantEvents'
    summary: RP-C1/RP-12 emits TrialExpired per expired trial tenant. Cron-origin.
    messages:
      - $ref: '#/channels/iamTenantEvents/messages/TrialExpired'

  sendTrialReactivated:
    action: send
    channel:
      $ref: '#/channels/iamTenantEvents'
    summary: RP-10's trial branch emits TrialReactivated.
    messages:
      - $ref: '#/channels/iamTenantEvents/messages/TrialReactivated'

  sendTenantSuspended:
    action: send
    channel:
      $ref: '#/channels/iamTenantEvents'
    summary: RP-C3 lapse sweep (source=billing_lapse) or RP-14 (source=operator) emits TenantSuspended.
    messages:
      - $ref: '#/channels/iamTenantEvents/messages/TenantSuspended'

  sendTenantOffboarded:
    action: send
    channel:
      $ref: '#/channels/iamTenantEvents'
    summary: RP-C3 emits TenantOffboarded after confirmed S3 export + realm delete. Terminal (RP-INV-5).
    messages:
      - $ref: '#/channels/iamTenantEvents/messages/TenantOffboarded'

  sendTenantReactivated:
    action: send
    channel:
      $ref: '#/channels/iamTenantEvents'
    summary: RP-10's paid branch emits TenantReactivated(source=operator) — RP-D13.
    messages:
      - $ref: '#/channels/iamTenantEvents/messages/TenantReactivated'

  receiveMembershipRealmEvents:
    action: receive
    channel:
      $ref: '#/channels/membershipRealmQueue'
    summary: Consume O&M's department/tenant-role events to sync requires-mfa (§8.6).
    messages:
      - $ref: '#/channels/membershipRealmQueue/messages/DepartmentMembershipGranted'
      - $ref: '#/channels/membershipRealmQueue/messages/DepartmentMembershipLevelChanged'
      - $ref: '#/channels/membershipRealmQueue/messages/TenantRoleGranted'
      - $ref: '#/channels/membershipRealmQueue/messages/TenantRoleRevoked'

  receiveTrialStarted:
    action: receive
    channel:
      $ref: '#/channels/tenantRealmQueue'
    summary: Consume O&M's TrialStarted to record trial_ends_at locally (RP-4).
    messages:
      - $ref: '#/channels/tenantRealmQueue/messages/TrialStarted'

  receiveBillingTenantReactivated:
    action: receive
    channel:
      $ref: '#/channels/billingRealmQueue'
    summary: Consume Billing's TenantReactivated to re-enable a suspended dedicated realm (§8.11).
    messages:
      - $ref: '#/channels/billingRealmQueue/messages/BillingTenantReactivated'

components:
  securitySchemes:
    iamRole:
      type: httpApiKey
      name: Authorization
      in: header
      description: AWS IAM role attached to the pod via IRSA (IAM Roles for Service Accounts).

  tags:
    published:
      name: published
      description: |
        This service is the producer. Emitted onto the shared iam-tenant-events
        SNS topic (co-produced alongside Org & Membership, HLD §9.1.1) via the
        transactional outbox. All 10 of this service's own event types —
        TrialTenantProvisioned, TenantIdentityProvisioned, TenantRealmReady, TenantConverted,
        DirectPaidSignup, TrialExpired, TrialReactivated, TenantSuspended,
        TenantOffboarded, TenantReactivated(source=operator) — carry this tag.
    consumed:
      name: consumed
      description: |
        This service is the consumer, not the producer. Per §7.1, this
        service subscribes to three inbound queues: membership-realm-q
        (O&M's department/tenant-role events, MFA sync), tenant-realm-q
        (O&M's TrialStarted, trial timer record), and billing-realm-q
        (Billing's TenantReactivated, reactivation) — RP-D13 notes this
        service's own produced TenantReactivated rides a different topic, so
        there is no self-consumption. Canonical schema ownership for
        anything tagged consumed sits with the producing service's own
        AsyncAPI spec, not this file — treat these definitions as this
        service's consumer-side documentation, kept in sync with upstream,
        not as the source of truth.

  messageTraits:
    glueWireFormat:
      description: |
        Message body is prefixed with the 18-byte Glue Schema Registry wire-format header:
        [0x03][0x00][16-byte schema version UUID (big-endian)] followed by the JSON payload.
        Consumers must strip this header before parsing the EventEnvelope JSON.

  messages:
    TrialTenantProvisioned:
      title: TrialTenantProvisioned
      tags:
        - $ref: '#/components/tags/published'
      traits:
        - $ref: '#/components/messageTraits/glueWireFormat'
      payload:
        $ref: '#/components/schemas/TrialTenantProvisionedPayload'

    TenantIdentityProvisioned:
      title: TenantIdentityProvisioned
      tags:
        - $ref: '#/components/tags/published'
      traits:
        - $ref: '#/components/messageTraits/glueWireFormat'
      payload:
        $ref: '#/components/schemas/TenantIdentityProvisionedPayload'

    TenantRealmReady:
      title: TenantRealmReady
      tags:
        - $ref: '#/components/tags/published'
      traits:
        - $ref: '#/components/messageTraits/glueWireFormat'
      payload:
        $ref: '#/components/schemas/TenantRealmReadyPayload'

    TenantConverted:
      title: TenantConverted
      tags:
        - $ref: '#/components/tags/published'
      traits:
        - $ref: '#/components/messageTraits/glueWireFormat'
      payload:
        $ref: '#/components/schemas/TenantConvertedPayload'

    DirectPaidSignup:
      title: DirectPaidSignup
      tags:
        - $ref: '#/components/tags/published'
      traits:
        - $ref: '#/components/messageTraits/glueWireFormat'
      payload:
        $ref: '#/components/schemas/DirectPaidSignupPayload'

    TrialExpired:
      title: TrialExpired
      tags:
        - $ref: '#/components/tags/published'
      traits:
        - $ref: '#/components/messageTraits/glueWireFormat'
      payload:
        $ref: '#/components/schemas/TrialExpiredPayload'

    TrialReactivated:
      title: TrialReactivated
      tags:
        - $ref: '#/components/tags/published'
      traits:
        - $ref: '#/components/messageTraits/glueWireFormat'
      payload:
        $ref: '#/components/schemas/TrialReactivatedPayload'

    TenantSuspended:
      title: TenantSuspended
      tags:
        - $ref: '#/components/tags/published'
      traits:
        - $ref: '#/components/messageTraits/glueWireFormat'
      payload:
        $ref: '#/components/schemas/TenantSuspendedPayload'

    TenantOffboarded:
      title: TenantOffboarded
      tags:
        - $ref: '#/components/tags/published'
      traits:
        - $ref: '#/components/messageTraits/glueWireFormat'
      payload:
        $ref: '#/components/schemas/TenantOffboardedPayload'

    TenantReactivated:
      title: TenantReactivated
      description: Produced by this service (source=operator). See BillingTenantReactivated for the consumed counterpart (RP-D13).
      tags:
        - $ref: '#/components/tags/published'
      traits:
        - $ref: '#/components/messageTraits/glueWireFormat'
      payload:
        $ref: '#/components/schemas/TenantReactivatedPayload'

    DepartmentMembershipGranted:
      title: DepartmentMembershipGranted
      description: Consumed only — canonical schema owned by iam-org-membership's own AsyncAPI spec. additionalProperties left open.
      tags:
        - $ref: '#/components/tags/consumed'
      traits:
        - $ref: '#/components/messageTraits/glueWireFormat'
      payload:
        $ref: '#/components/schemas/DepartmentMembershipGrantedPayload'

    DepartmentMembershipLevelChanged:
      title: DepartmentMembershipLevelChanged
      description: Consumed only — canonical schema owned by iam-org-membership.
      tags:
        - $ref: '#/components/tags/consumed'
      traits:
        - $ref: '#/components/messageTraits/glueWireFormat'
      payload:
        $ref: '#/components/schemas/DepartmentMembershipLevelChangedPayload'

    TenantRoleGranted:
      title: TenantRoleGranted
      description: Consumed only — canonical schema owned by iam-org-membership.
      tags:
        - $ref: '#/components/tags/consumed'
      traits:
        - $ref: '#/components/messageTraits/glueWireFormat'
      payload:
        $ref: '#/components/schemas/TenantRoleGrantedPayload'

    TenantRoleRevoked:
      title: TenantRoleRevoked
      description: Consumed only — canonical schema owned by iam-org-membership.
      tags:
        - $ref: '#/components/tags/consumed'
      traits:
        - $ref: '#/components/messageTraits/glueWireFormat'
      payload:
        $ref: '#/components/schemas/TenantRoleRevokedPayload'

    TrialStarted:
      title: TrialStarted
      description: Consumed only — canonical schema owned by iam-org-membership.
      tags:
        - $ref: '#/components/tags/consumed'
      traits:
        - $ref: '#/components/messageTraits/glueWireFormat'
      payload:
        $ref: '#/components/schemas/TrialStartedPayload'

    BillingTenantReactivated:
      title: TenantReactivated (billing.events)
      description: Consumed only — Billing's own TenantReactivated (source=billing), distinct topic from this service's produced TenantReactivated (RP-D13).
      tags:
        - $ref: '#/components/tags/consumed'
      traits:
        - $ref: '#/components/messageTraits/glueWireFormat'
      payload:
        $ref: '#/components/schemas/BillingTenantReactivatedPayload'

  schemas:
    EventEnvelopeBase:
      type: object
      description: Shared envelope fields on every event this service publishes (§7.3).
      required: [id, type, source, specversion, time, data, tenant_id]
      properties:
        id: { type: string, format: uuid, description: "UUID v7, consumer dedup key" }
        type: { type: string, description: "PascalCase event name" }
        source: { type: string, const: "iam-realm-provisioner" }
        specversion: { type: string, const: "1" }
        time: { type: string, format: date-time }
        tenant_id: { type: string, format: uuid }
        trace_id: { type: string }
        subject: { type: string }
        actor: { type: string }
        dataschema: { type: string, description: "Glue schema-version UUID" }
        ip_address: { type: string }
        user_agent: { type: string }

    TrialTenantProvisionedPayload:
      type: object
      additionalProperties: true
      required: [tenant_id, realm, keycloak_user_id]
      properties:
        tenant_id: { type: string, format: uuid }
        realm: { type: string, const: "trial" }
        keycloak_user_id: { type: string, format: uuid }

    TenantIdentityProvisionedPayload:
      type: object
      additionalProperties: true
      required: [tenant_id, owner_user_id, slug, name, plan, signup_type, realm, realm_type]
      properties:
        tenant_id: { type: string, format: uuid }
        owner_user_id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        plan: { type: string, enum: [starter, pro, enterprise] }
        signup_type: { type: string, enum: [trial, direct_paid] }
        realm: { type: string }
        realm_type: { type: string, enum: [shared, dedicated] }

    TenantRealmReadyPayload:
      type: object
      additionalProperties: true
      required: [tenant_id, realm, keycloak_shard, oidc_clients]
      properties:
        tenant_id: { type: string, format: uuid }
        realm: { type: string }
        keycloak_shard: { type: string }
        oidc_clients: { type: array, items: { type: string } }

    TenantConvertedPayload:
      type: object
      additionalProperties: true
      required: [tenant_id, realm, plan, users_migrated, direct_signup]
      properties:
        tenant_id: { type: string, format: uuid }
        realm: { type: string }
        plan: { type: string, enum: [starter, pro, enterprise] }
        billing_subscription_id: { type: string }
        users_migrated: { type: integer, minimum: 0 }
        direct_signup: { type: boolean }

    DirectPaidSignupPayload:
      type: object
      additionalProperties: true
      required: [tenant_id, realm, plan, direct_signup]
      properties:
        tenant_id: { type: string, format: uuid }
        realm: { type: string }
        plan: { type: string, enum: [starter, pro, enterprise] }
        direct_signup: { type: boolean, const: true }

    TrialExpiredPayload:
      type: object
      additionalProperties: true
      required: [tenant_id, trial_ends_at, grace_ends_at]
      properties:
        tenant_id: { type: string, format: uuid }
        trial_ends_at: { type: string, format: date-time }
        grace_ends_at: { type: string, format: date-time }

    TrialReactivatedPayload:
      type: object
      additionalProperties: true
      required: [tenant_id, new_trial_ends_at]
      properties:
        tenant_id: { type: string, format: uuid }
        new_trial_ends_at: { type: string, format: date-time }

    TenantSuspendedPayload:
      type: object
      additionalProperties: true
      required: [tenant_id, realm, suspended_at, source]
      properties:
        tenant_id: { type: string, format: uuid }
        realm: { type: string }
        cancelled_at: { type: string, format: date-time }
        suspended_at: { type: string, format: date-time }
        source: { type: string, enum: [billing_lapse, operator] }
        reason: { type: string }

    TenantOffboardedPayload:
      type: object
      additionalProperties: true
      required: [tenant_id, realm, export_s3_key, offboarded_at]
      properties:
        tenant_id: { type: string, format: uuid }
        realm: { type: string }
        export_s3_key: { type: string }
        offboarded_at: { type: string, format: date-time }

    TenantReactivatedPayload:
      type: object
      additionalProperties: true
      required: [tenant_id, realm, source]
      properties:
        tenant_id: { type: string, format: uuid }
        realm: { type: string }
        source: { type: string, enum: [operator] }
        reason: { type: string }

