# Default values for iam-realm-provisioner.
#
# Deployment topology (§13.1): a "server" Deployment (2-4 replicas, HPA)
# serves the HTTP API (RP-1..RP-16) AND runs the three inbound SQS
# consumers (membership-realm-q, tenant-realm-q, billing-realm-q) plus the
# transactional-outbox Runner in-process — same "one process, several
# responsibilities" pattern as the sibling IAM services. Six CronJobs
# (RP-C1..RP-C4 plus outbox-prune/processed-events-prune, §8.7-8.10) run
# from the SAME image (it carries both binaries — see the repo-root
# Dockerfile), each overriding `command` to invoke
# /iam-realm-provisioner-reconciler --job=<name> (see templates/cronjobs.yaml,
# which cmd/reconciler/main.go's own header comment already anticipates as a
# single multi-CronJob manifest).

replicaCount: 2

image:
  repository: ghcr.io/bcbp-solutions-fzc-llc/iam-realm-provisioner
  pullPolicy: IfNotPresent
  tag: ""  # overridden by CI to the git SHA / release version; falls back to Chart.appVersion

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  # Annotations added to the ServiceAccount:
  #   - IRSA on EKS, for the SNS/SQS/Glue/S3 permissions in deploy/iam/policy.json:
  #       eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/iam-realm-provisioner
  #   this service also authenticates to OpenBao via this ServiceAccount's
  #   projected JWT against the Kubernetes auth method (BAO_AUTH_ROLE,
  #   deploy/openbao/role.tf.example) — no annotation needed for that path,
  #   only that automountServiceAccountToken stays true (overridden below,
  #   unlike a sibling service with no such dependency).
  annotations: {}

service:
  type: ClusterIP
  port: 8080
  metricsPort: 9090

# HPA — CPU/memory by default. §14 carries no queue-depth-based scaling
# requirement for this service (unlike a cascade-consumer-heavy sibling), so
# no custom-metrics adapter is wired in by default; RP-1/RP-4 traffic is
# driven by tenant lifecycle events (signup/conversion/trial expiry), not
# sustained high RPS.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  # Optional RPS-based scaling (unset/0 = disabled, CPU/memory only).
  # PREREQUISITE: prometheus-adapter installed with the rule at
  # deploy/monitoring/prometheus-adapter-rule.yaml — without it this metric
  # is silently absent from the custom metrics API and the HPA falls back
  # to CPU/memory only. Enable only if a given deployment's RP-1/RP-4
  # traffic justifies it.
  targetRPSPerReplica: 0

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

# Non-secret env, rendered directly onto the server container (see
# templates/deployment.yaml). Anything with a credential (DATABASE_URL,
# KEYCLOAK_ADMIN_CLIENT_SECRET, DOCS_AUTH_TOKEN) or a per-environment AWS
# identifier the service cannot start correctly without (SNS_TOPIC_TENANT_ARN,
# the three SQS queue URLs) lives in envFromSecret below. Every key here is
# read by this service's code or by platform-gincommon / platform-events /
# platform-pgcommon. Mirrors .env-example, flattened to production defaults.
env:
  # Observability environment label: must be one of local|dev|test|staging|prod
  # (platform-gincommon/-events/-pgcommon panic or refuse to start on anything
  # else, e.g. "production"). Override per environment (e.g. staging).
  APP_ENV: "prod"
  APP_NAME: "iam-realm-provisioner"
  # Platform Observability Registry domain — the {domain} const label on
  # every metric (cmd/server and cmd/reconciler also default to "iam").
  OBSERVABILITY_DOMAIN: "iam"
  # Logging — read by platform-gincommon's logger (all binaries).
  LOG_LEVEL: "info"          # debug | info | warn | error
  LOG_SAMPLING: "false"      # zap sampling of repetitive entries
  APP_PORT: "8080"
  METRICS_PORT: "9090"

  # Postgres pool sizing (pgcommon.ConfigFromEnv()) — DATABASE_URL/
  # SYSTEM_DATABASE_URL/MIGRATION_DATABASE_URL (envFromSecret below) already
  # embed host/user/dbname/sslmode, so no discrete PG_HOST/PG_USER/PG_DBNAME
  # is set here.
  PG_MAX_CONNS: "10"
  # platform-pgcommon's own recommendation when PGBouncerMode is true
  # (pkg/pgcommon/config.go): "MinConns: 0 — let PgBouncer manage the
  # backend pool size". Left unset, ConfigFromEnv() defaults PG_MIN_CONNS
  # to 2 regardless of PG_BOUNCER_MODE, keeping 2 idle backend connections
  # per pod open against PgBouncer unnecessarily.
  PG_MIN_CONNS: "0"
  PG_BOUNCER_MODE: "true"
  PG_STATEMENT_TIMEOUT: "5s"
  # Per-transaction lock_timeout (pgcommon, SET LOCAL) — a request queued
  # behind a lock fails fast with 503 request_timeout instead of holding a
  # pooled connection for the whole statement timeout (matches iam-org-membership).
  PG_LOCK_TIMEOUT: "2s"
  PG_SLOW_QUERY_THRESHOLD: "200ms"

  # AWS SNS/SQS/Glue/S3 (§7/§13.4) — credentials come from the pod's IRSA
  # role (serviceAccount.annotations above), not env vars. The per-environment
  # topic ARN and queue URLs are in envFromSecret below (as in
  # iam-org-membership), so the chart refuses to render without them:
  # outside dev, cmd/server's validateRequiredEnv panics on an empty
  # SNS_TOPIC_TENANT_ARN / GLUE_REGISTRY_TENANT_NAME, and an empty queue URL
  # silently disables that consumer.
  AWS_REGION: "ap-south-1"
  # The shared IAM tenant-events Glue registry (§7.3.1) — the same name in
  # every environment, so it has a real default (matches iam-org-membership).
  GLUE_REGISTRY_TENANT_NAME: "iam-tenant-events"
  SQS_MEMBERSHIP_REALM_CONCURRENCY: "4"
  SQS_TENANT_REALM_CONCURRENCY: "4"
  SQS_BILLING_REALM_CONCURRENCY: "2"
  # Shared consumer tuning for all three queues, read by platform-events'
  # eventcfg.LoadSQS (internal/adapter/inbound/sqspipeline fills the same
  # values as defaults when unset). SQS_MAX_RECEIVE_COUNT must stay below the
  # queues' RedrivePolicy maxReceiveCount=5 so platform-events' own DLQ
  # forward wins over SQS's silent redrive; the handler timeout must stay
  # below the visibility timeout.
  SQS_MAX_RECEIVE_COUNT: "4"
  SQS_VISIBILITY_TIMEOUT: "30s"
  SQS_HANDLER_TIMEOUT: "20s"
  SQS_DRAIN_TIMEOUT: "15s"
  SQS_QUEUE_DEPTH_INTERVAL: "60s"   # platform_queue_depth / platform_dlq_depth sampling

  OUTBOX_POLL_INTERVAL: "500ms"
  OUTBOX_BATCH_SIZE: "50"
  OUTBOX_MAX_ATTEMPTS: "5"
  OUTBOX_DRAIN_TIMEOUT: "30s"
  # Read through platform-events' eventcfg.LoadOutbox — set explicitly so
  # the library defaults (1 publisher, no jitter/lease) never apply here.
  OUTBOX_PUBLISH_CONCURRENCY: "4"
  OUTBOX_PUBLISH_TIMEOUT: "10s"
  OUTBOX_STARTUP_JITTER: "2s"
  OUTBOX_CLAIM_LEASE_DURATION: "10m"
  OUTBOX_RETENTION_DAYS: "8"
  PROCESSED_EVENTS_TTL_DAYS: "8"
  # ledger-prune retention (§15): the idempotency ledger and the sampled RLS
  # violation log. Requires the migrator role to hold DELETE on both
  # (Terraform).
  PROVISIONING_OPERATIONS_TTL_DAYS: "30"
  RLS_VIOLATION_LOG_TTL_DAYS: "90"

  # Keycloak (RP-INV-1 — the sole seam, internal/adapter/outbound/keycloak/).
  # KEYCLOAK_ADMIN_CLIENT_SECRET lives in envFromSecret below.
  KEYCLOAK_BASE_URL: "http://keycloak.iam.svc.cluster.local"
  KEYCLOAK_ADMIN_REALM: "master"
  KEYCLOAK_ADMIN_CLIENT_ID: "iam-realm-provisioner"
  KEYCLOAK_RATE_LIMIT_RPS: "20"
  KEYCLOAK_TIMEOUT_MS: "8s"
  SHARED_TRIAL_REALM: "trial"
  REALM_TEMPLATE_VERSION: "v1"
  # The versioned template the image ships (Dockerfile copies
  # deploy/keycloak/realm-template.json here; LLD §12.2). Without it the code
  # silently falls back to the copy embedded in the binary.
  REALM_TEMPLATE_PATH: "/deploy/keycloak/realm-template.json"

  # OpenBao (per-tenant IdP secrets + Keycloak admin credential, §12) — no
  # static token: this pod authenticates via its ServiceAccount JWT against
  # OpenBao's Kubernetes auth method (BAO_AUTH_ROLE).
  BAO_ADDR: "http://openbao.openbao.svc.cluster.local:8200"
  BAO_AUTH_ROLE: "iam-realm-provisioner"
  BAO_KV_MOUNT: "secret"
  BAO_IDP_PATH_PREFIX: "iam/realm-provisioner/idp"
  BAO_KEYCLOAK_ADMIN_PATH: "iam/realm-provisioner/keycloak-admin"

  # Org & Membership — I-8 residual-MFA-requirement check.
  ORG_MEMBERSHIP_BASE_URL: "http://iam-org-membership.iam.svc.cluster.local"

  # Token Service — TS-1/TS-4 mint/rotate handshake (§2.5, RP-17). REQUIRED:
  # validateRequiredEnv panics at startup outside dev when it is empty.
  TOKEN_SERVICE_BASE_URL: "http://iam-token-service.iam.svc.cluster.local"

  # Audit Log — AL-5 direct-write ingest for TenantIdpConfigChanged (LLD
  # §10.6/§18.7). Empty = drainer disabled (startup WARN); entries queue
  # durably in pending_audit_entries and deliver once this is set, e.g.
  # "http://iam-audit-log.iam.svc.cluster.local" when iam-audit-log ships.
  AUDIT_LOG_BASE_URL: ""
  AUDIT_DELIVERY_INTERVAL: "5s"
  AUDIT_DELIVERY_BATCH_SIZE: "50"

  # Realm export (offboarding, §15.2) — S3 bucket + KMS key for the
  # encrypted export written before a dedicated realm is deleted.
  REALM_EXPORT_BUCKET: "iam-realm-exports"
  REALM_EXPORT_KMS_KEY: ""

  # Lifecycle timers (§8.7-8.9) — shared by cmd/server (endpoint defaults)
  # and every reconciler CronJob (templates/cronjobs.yaml re-declares this
  # same env block, so a change here should be mirrored there or moved to a
  # ConfigMap in a future iteration).
  TRIAL_GRACE_DAYS: "30"
  CANCELLED_GRACE_DAYS: "30"
  RETENTION_DAYS: "60"
  RECONCILER_BATCH_LIMIT: "100"
  RECONCILER_TIMEOUT: "5m"
  RECONCILER_MAX_ATTEMPTS: "20"      # RP-C4 poison-pill cap (§8.10)
  # Idempotency ledger: an in_progress key older than this is reclaimed by
  # the next retry (a crashed or SIGKILLed execution). Must exceed
  # CONVERT_TIMEOUT.
  IDEMPOTENCY_IN_PROGRESS_LEASE: "15m"
  # RP-3 conversion runs detached from the 30s request deadline (callers get
  # 409 operation_in_progress and retry with the same key); this bounds it.
  CONVERT_TIMEOUT: "10m"
  # Reconciler CronJobs have no /metrics listener: each run pushes its
  # metrics here, grouped by cronjob (cmd/reconciler pushMetrics). Empty =
  # no push, so reconciler counters and the alerts built on them are dark.
  PROMETHEUS_PUSHGATEWAY_URL: ""

  DOCS_ENABLED: "false"

  # OpenTelemetry — read by platform-gincommon's InitTracingWithConfig
  # (OTLP/gRPC on 4317, not the legacy OTLP/HTTP 4318). APP_NAME above is the
  # service name; OTEL_SERVICE_NAME is not read. "none" disables export
  # while keeping trace IDs. The values below are the library's prod
  # defaults, set explicitly as in iam-org-membership.
  OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector.observability.svc.cluster.local:4317"
  OTEL_EXPORTER_OTLP_INSECURE: "false"
  OTEL_TRACES_SAMPLER_RATIO: "0.1"
  OTEL_PROPAGATOR_BAGGAGE: "false"
  # true at the edge only; this service is mesh-internal.
  OTEL_TRACES_IGNORE_REMOTE_PARENT_SAMPLED: "false"

# Env vars whose value comes from a Kubernetes Secret. Keys must be present
# in either .Values.existingSecret or .Values.secretValues. Shared by both
# the server Deployment and every reconciler CronJob (templates/cronjobs.yaml)
# — they all need the three Postgres DSNs; RECONCILER_BATCH_LIMIT and the
# lifecycle timers are non-secret and stay in .Values.env instead.
envFromSecret:
  - DATABASE_URL
  - SYSTEM_DATABASE_URL
  - MIGRATION_DATABASE_URL
  - KEYCLOAK_ADMIN_CLIENT_SECRET
  - SNS_TOPIC_TENANT_ARN
  - SQS_MEMBERSHIP_REALM_QUEUE_URL
  - SQS_TENANT_REALM_QUEUE_URL
  - SQS_BILLING_REALM_QUEUE_URL
  - DOCS_AUTH_TOKEN

# existingSecret — preferred for production. Set to the name of a
# pre-existing Kubernetes Secret whose keys match envFromSecret. When set,
# the chart creates no Secret resource and secretValues is ignored.
#
# DATABASE_URL here MUST be the runtime app role (realm_provisioner_app),
# which has no BYPASSRLS/CREATE. SYSTEM_DATABASE_URL/MIGRATION_DATABASE_URL
# MUST both be the BYPASSRLS realm_provisioner_migrator role — the migrate
# hook Job (templates/migrate-job.yaml) applies migrations with
# MIGRATION_DATABASE_URL, and RP-C1..C4 read across every tenant (§10.1).
existingSecret: ""

# rotationEpoch — used only when existingSecret is set. Bump this value to
# trigger a rolling restart after an external secret is rotated:
#   helm upgrade ... --set rotationEpoch=$(date +%s)
rotationEpoch: "0"

# Secret values — used ONLY when existingSecret is empty.
# Pass via --set or a Helm secrets plugin (never commit real values).
secretValues:
  DATABASE_URL: ""
  SYSTEM_DATABASE_URL: ""
  MIGRATION_DATABASE_URL: ""
  KEYCLOAK_ADMIN_CLIENT_SECRET: ""
  SNS_TOPIC_TENANT_ARN: ""
  SQS_MEMBERSHIP_REALM_QUEUE_URL: ""
  SQS_TENANT_REALM_QUEUE_URL: ""
  SQS_BILLING_REALM_QUEUE_URL: ""
  DOCS_AUTH_TOKEN: ""

# Shutdown budget (cmd/server/main.go): in parallel HTTP drain (30s), SQS
# consumer drain (SQS_DRAIN_TIMEOUT, 15s) and in-flight RP-3 conversions
# (30s); then outbox drain (OUTBOX_DRAIN_TIMEOUT, 30s); then pool drain
# (10s) = 70s + 5s buffer — matching iam-org-membership. At 30s the kubelet
# SIGKILLed the pod mid-drain.
terminationGracePeriodSeconds: 75

# podDisruptionBudget — ensures at least 1 pod survives voluntary
# disruptions (node drains, cluster upgrades). With minReplicas: 2 keep
# minAvailable=1 so a single node drain doesn't take the service to zero.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532      # distroless nonroot UID
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []

# startupProbe covers a slow cold start (Postgres pool warmup, Keycloak
# token fetch, AWS SDK config resolution) before liveness/readiness take
# over.
startupProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 2
  periodSeconds: 5
  failureThreshold: 12   # 12 x 5s = 60s startup budget
  timeoutSeconds: 3

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 0  # startupProbe handles the initial delay
  periodSeconds: 15
  failureThreshold: 3
  timeoutSeconds: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 0
  periodSeconds: 10
  failureThreshold: 3
  # /readyz runs Postgres.Health, SysPostgres.Health, Outbox.Health, and
  # Keycloak.Ready concurrently with no additional deadline of its own, so
  # the worst case is bounded by the single slowest check rather than their
  # sum — but Keycloak.Ready alone can still legitimately take up to
  # KEYCLOAK_TIMEOUT_MS (8s, below) under real latency (not an outage, just
  # slowness). A 3s probe timeout would time out the kubelet HTTP GET
  # itself before the handler's own graceful "not ready: keycloak slow"
  # response could ever return, flapping the pod out of the Service under
  # exactly the latency this probe exists to detect cleanly.
  timeoutSeconds: 10

# Commercial callers (CD-19) — Billing's access to RP-3/RP-4/RP-11.
# When enabled this block renders:
#   - An extra NetworkPolicy ingress rule from the billing namespace
#     (ServiceAccount: commercial-billing) on the HTTP API port.
# When enabled AND istio.enabled, it additionally renders:
#   - An Istio AuthorizationPolicy restricting Billing to exactly the three
#     Commercial-allowed paths (RP-3/RP-4/RP-11) while admitting all existing
#     callers (namespaces listed in istio.existingCallerNamespaces) on every path.
#   authorizationpolicy.yaml is NOT rendered when istio.enabled is false so that
#   clusters without Istio CRDs do not fail on an unknown resource kind.
# The "commercial" namespace (Entitlements, Usage & Metering) does NOT call RP
# directly and therefore is NOT admitted here.
# Set enabled: true in environment-specific values for staging and prod once
# the Billing service is deployed and the commercial-billing ServiceAccount exists.
# Set istio.enabled: true only in clusters where Istio is installed.
commercialCallers:
  enabled: false
  # Kubernetes namespace for the Billing service.
  billingNamespace: billing
  # Kubernetes ServiceAccount name used by the Billing service pod.
  billingServiceAccount: commercial-billing

  # Istio mesh-policy settings (CD-19 alignment rule 2/3).
  istio:
    # enabled: render an Istio AuthorizationPolicy. Set true ONLY in clusters
    # where Istio CRDs are present; false (the default) prevents the
    # AuthorizationPolicy from being applied on non-Istio clusters, which
    # would fail helm install/upgrade with "no matches for kind AuthorizationPolicy".
    enabled: false
    # trustDomain is prepended to principal strings in the ALLOW rules:
    #   "{{ trustDomain }}/ns/<namespace>/sa/<serviceaccount>"
    # Default is cluster.local — override if your cluster uses a custom domain.
    trustDomain: cluster.local
    # existingCallerNamespaces lists every namespace that already has L4 access
    # to the API port via the NetworkPolicy ingress rules (excluding billing,
    # which gets a path-restricted rule below). An Istio ALLOW policy denies
    # every request that matches no rule, so without this list the existing
    # callers (Core/O&M in iam, Signup BFF via envoy-gateway-system) would
    # lose access the moment the AuthorizationPolicy is rendered.
    # Typical values (set per environment):
    #   - iam               (Core / iam-org-membership, same-namespace rule)
    #   - envoy-gateway-system (Signup BFF / gateway, ingressControllerNamespaceSelector)
    existingCallerNamespaces: []

# NetworkPolicy — enabled by default (§13). Public API traffic (RP-1..RP-16)
# reaches the "http" port via the gateway/mesh. :9090/metrics is restricted
# to the monitoring namespace only.
networkPolicy:
  enabled: true
  ingressControllerNamespaceSelector:
    kubernetes.io/metadata.name: envoy-gateway-system
  ingressControllerPodSelector: {}
  metricsIngress:
    enabled: true
    namespaceSelector:
      kubernetes.io/metadata.name: monitoring
    podSelector:
      app.kubernetes.io/name: prometheus
  additionalIngressRules: []
  additionalEgressRules: []
  # Postgres egress: direct Postgres (migrations) and PgBouncer (the pools).
  databasePorts: [5432, 6432]
  # Prometheus Pushgateway, for the reconciler CronJobs' metric push.
  pushgatewayPort: 9091

# ServiceMonitor — requires kube-prometheus-stack (monitoring.coreos.com/v1
# CRD). PrometheusRule (alerting rules) is also gated on this flag — no
# scrape means no metrics, which means every alert stays permanently
# inactive.
serviceMonitor:
  enabled: true
  interval: "30s"
  scrapeTimeout: "10s"
  additionalLabels: {}
  relabelings: []
  namespaceSelector: {}

# Ingress — disabled by default; this service is normally reached only
# through the shared Envoy gateway/mesh. Enable only if a caller sits
# outside the cluster.
ingress:
  enabled: false
  type: HTTPRoute

  hosts:
    - host: iam-realm-provisioner.internal.example.com
      paths:
        - path: /api/v1
          pathType: PathPrefix

  gateway:
    name: ""              # required — name of the Gateway resource
    namespace: ""         # optional — defaults to the release namespace
    sectionName: ""       # optional — target a specific listener (e.g. "https")

  securityPolicy:
    enabled: false
    cors:
      enabled: false
      allowOrigins: []
      allowMethods:
        - GET
        - POST
        - PATCH
        - DELETE
        - OPTIONS
      allowHeaders:
        - Authorization
        - Content-Type
        - Idempotency-Key
        - X-Tenant-Id
        - X-User-Id
        - X-User-Roles
      maxAge: "86400"
    rateLimit:
      enabled: false
      requestsPerUnit: 1000
      unit: Second          # Second | Minute | Hour

  className: ""
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  tls: []
  #  - secretName: iam-realm-provisioner-tls
  #    hosts:
  #      - iam-realm-provisioner.internal.example.com

# Schema migrations: a pre-install / pre-upgrade hook Job (cmd/migrate,
# templates/migrate-job.yaml) runs them once per release; the Deployment
# runs with RUN_MIGRATIONS=false. Set enabled=false to fall back to
# migrate-at-startup.
migrations:
  job:
    enabled: true
    backoffLimit: 1
    timeout: "10m"              # MIGRATE_TIMEOUT, lock wait included
    activeDeadlineSeconds: 900  # > timeout

# ── Reconciler CronJobs (§8.7-8.10, templates/cronjobs.yaml) ───────────────
# Each CronJob runs the SAME image as the Deployment (image above), with
# `command` overridden to the iam-realm-provisioner-reconciler binary and a
# `--job=<name>` argument selecting which handler in
# cmd/reconciler/main.go's registry to run.
cronjobs:
  trialExpiry:
    enabled: true
    schedule: "0 2 * * *"        # RP-C1 (§8.7)
    jobName: trial-expiry
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    # Must exceed RECONCILER_TIMEOUT (5m/300s) so the application's internal
    # context deadline fires first and the job exits cleanly before Kubernetes
    # hard-kills it. 360s = 300s + 60s buffer (same as realmConfigReconcile).
    activeDeadlineSeconds: 360
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  trialHardDelete:
    enabled: true
    schedule: "0 3 * * *"        # RP-C2 (§8.7)
    jobName: trial-hard-delete
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    # Must exceed RECONCILER_TIMEOUT (5m/300s) — same reasoning as trialExpiry above.
    activeDeadlineSeconds: 360
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  subscriptionLapse:
    enabled: true
    schedule: "0 2 * * *"        # RP-C3 (§8.8/§8.9) — blocked on the O&M
                                  # subscription-status-read endpoint being
                                  # unspecified (port.SubscriptionStatusReader
                                  # doc comment); no-ops until wired.
    jobName: subscription-lapse
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    activeDeadlineSeconds: 900
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  realmConfigReconcile:
    enabled: true
    schedule: "*/10 * * * *"     # RP-C4 (§8.10)
    jobName: realm-config-reconcile
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    # Must exceed RECONCILER_TIMEOUT (5m/300s, env block below) — this was
    # previously 240s, 60s *shorter* than the app's own internal context
    # deadline, so Kubernetes would hard-kill the Job before the app could
    # ever exit cleanly on its own terms. 360s leaves the same ~60s buffer
    # the other CronJobs keep above the shared timeout, while still well
    # under the 10-minute schedule interval.
    activeDeadlineSeconds: 360
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  # The LLD's own outbox-prune entry (§3.1) leaves open whether this runs as
  # a cmd/server background ticker or a separate CronJob ("verify against
  # sibling pattern"); this codebase's cmd/reconciler/main.go registry
  # already wires it as a --job value, and its own header comment
  # anticipates "6 CronJobs" in this one manifest — so it is scheduled here.
  # No schedule is pinned by the LLD; 04:00 daily (offset from the 02:00/
  # 03:00 lifecycle crons above) is this chart's own choice.
  outboxPrune:
    enabled: true
    schedule: "0 4 * * *"        # this chart's own choice — not LLD-pinned
    jobName: outbox-prune
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    # Must exceed RECONCILER_TIMEOUT (5m/300s) — see realmConfigReconcile's
    # comment above for why an equal value hard-kills the Job before the
    # app's own internal deadline can fire.
    activeDeadlineSeconds: 360
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 128Mi
  processedEventsPrune:
    enabled: true
    schedule: "30 4 * * *"       # this chart's own choice — not LLD-pinned
    jobName: processed-events-prune
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    # Must exceed RECONCILER_TIMEOUT (5m/300s) — see realmConfigReconcile's
    # comment above for why an equal value hard-kills the Job before the
    # app's own internal deadline can fire.
    activeDeadlineSeconds: 360
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 128Mi
  ledgerPrune:
    enabled: true
    schedule: "0 5 * * *"        # §15 retention: provisioning_operations + rls_violation_log
    jobName: ledger-prune
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    # Must exceed RECONCILER_TIMEOUT (5m/300s) — see realmConfigReconcile's
    # comment above for why an equal value hard-kills the Job before the
    # app's own internal deadline can fire.
    activeDeadlineSeconds: 360
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 128Mi
