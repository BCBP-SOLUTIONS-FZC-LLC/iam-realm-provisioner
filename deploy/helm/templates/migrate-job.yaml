{{- /*
Schema migration Job — runs cmd/migrate once per release, before the new
replicas start (Helm pre-install / pre-upgrade hook). The Deployment then
runs with RUN_MIGRATIONS=false, so its replicas never contend for the
migration advisory lock at startup, and a failed migration fails the
release instead of crash-looping pods. Disable with migrations.job.enabled
=false to fall back to migrate-at-startup.
*/ -}}
{{- if .Values.migrations.job.enabled }}
{{- if .Values.networkPolicy.enabled }}
# The migrate pod carries only {instance, component=migrate} labels, so the
# chart's main NetworkPolicy (selectorLabels) does not select it. Under a
# namespace default-deny it could not reach Postgres. This policy is a hook
# created before the Job (weight -5), so it exists on the first install too:
# egress to DNS and Postgres only, no ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "iam-realm-provisioner.fullname" . }}-migrate
  labels:
    {{- include "iam-realm-provisioner.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: migrate
  policyTypes:
    - Ingress
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        {{- range .Values.networkPolicy.databasePorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
---
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "iam-realm-provisioner.fullname" . }}-migrate
  labels:
    {{- include "iam-realm-provisioner.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.job.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.job.activeDeadlineSeconds }}
  template:
    metadata:
      # Deliberately NOT the chart's selectorLabels: the Service, PDB and
      # NetworkPolicy select on those, and must never pick up this pod.
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The namespace's default ServiceAccount, which always exists. This
      # chart's own ServiceAccount is an ordinary resource, created only
      # AFTER pre-install hooks finish, so a first `helm install` would leave
      # this Job unable to create its pod. The migration needs no IRSA role or
      # OpenBao login — only MIGRATION_DATABASE_URL from the Secret — so no
      # token is mounted either.
      serviceAccountName: default
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ include "iam-realm-provisioner.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/migrate"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: APP_ENV
              value: {{ .Values.env.APP_ENV | default "prod" | quote }}
            - name: MIGRATE_TIMEOUT
              value: {{ .Values.migrations.job.timeout | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.env.LOG_LEVEL | default "info" | quote }}
            - name: LOG_SAMPLING
              value: {{ .Values.env.LOG_SAMPLING | default "false" | quote }}
            {{- $secretName := include "iam-realm-provisioner.secretName" . }}
            - name: MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: MIGRATION_DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
