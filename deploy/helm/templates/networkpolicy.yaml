{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "iam-realm-provisioner.fullname" . }}
  labels:
    {{- include "iam-realm-provisioner.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "iam-realm-provisioner.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Ingress-controller (gateway) namespace — ONLY when this service has a
    # route behind the gateway (ingress.enabled). Every API route is
    # /api/v1/internal/*, which the public gateway never routes, so by default
    # the gateway namespace gets no access (BFF open gap A-2).
    {{- if .Values.ingress.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressControllerNamespaceSelector | nindent 14 }}
          {{- with .Values.networkPolicy.ingressControllerPodSelector }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
    {{- end }}

    # Allow same-namespace, mesh-internal traffic on the "http" port (e.g.
    # any internal caller reaching this service directly rather than
    # through the gateway).
    - from:
        - podSelector: {}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP

    # Allow Prometheus to scrape :9090/metrics — restricted to the
    # monitoring namespace. Metrics live on a SEPARATE port from the API,
    # so this rule (unlike the two above) grants no API access.
    {{- if .Values.networkPolicy.metricsIngress.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.metricsIngress.namespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.metricsIngress.podSelector | nindent 14 }}
      ports:
        - port: {{ .Values.service.metricsPort }}
          protocol: TCP
    {{- end }}

    # CD-19: Billing namespace → RP HTTP port for RP-3/RP-4/RP-11.
    # Mesh AuthorizationPolicy (authorizationpolicy.yaml) further restricts
    # this to the three specific paths. The "commercial" namespace
    # (Entitlements, Usage & Metering) does NOT call RP and is NOT admitted.
    {{- if .Values.commercialCallers.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.commercialCallers.billingNamespace | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.commercialCallers.billingServiceAccount | quote }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
    {{- end }}

    # Signup BFF (signupBffCaller) — the bff-signup pods only, never the whole
    # bff namespace (BFF-1). L4 only: the Istio AuthorizationPolicy, where
    # enabled, limits them to RP-1 and RP-2.
    {{- if .Values.signupBffCaller.enabled }}
    {{- if not .Values.signupBffCaller.podSelector }}
    {{- fail "signupBffCaller.podSelector is required: an empty selector would admit every pod in the bff namespace (BFF-1 requires pod-level admission)." }}
    {{- end }}
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.signupBffCaller.namespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.signupBffCaller.podSelector | nindent 14 }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
    {{- end }}

    {{- with .Values.networkPolicy.additionalIngressRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}

  egress:
    # Allow DNS resolution (required for all outbound connections, including
    # cluster-DNS lookups of Postgres/Keycloak/OpenBao/iam-org-membership).
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

    # Allow HTTPS to AWS regional endpoints — SNS (the iam.tenant.events
    # outbox publish, §7.3) AND SQS (the three inbound consumers, §7.1) AND
    # S3 (realm export on offboarding, §15.2) AND Glue Schema Registry
    # (wire-format validation at publish time).
    - ports:
        - port: 443
          protocol: TCP

    # Allow PostgreSQL connections: direct Postgres (MIGRATION_DATABASE_URL,
    # 5432) and PgBouncer (DATABASE_URL / SYSTEM_DATABASE_URL, commonly 6432).
    - ports:
        {{- range .Values.networkPolicy.databasePorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}

    # Allow HTTP to Keycloak's Admin API — RP-INV-1's sole seam
    # (internal/adapter/outbound/keycloak/).
    - ports:
        - port: 8080
          protocol: TCP

    # Allow HTTPS to OpenBao — per-tenant IdP secrets + the Keycloak admin
    # credential (§12), reached via this pod's ServiceAccount JWT against
    # OpenBao's Kubernetes auth method.
    - ports:
        - port: 8200
          protocol: TCP

    # Allow HTTP to iam-org-membership — the I-8 residual-MFA-requirement
    # check — and to iam-audit-log's AL-5 direct-write ingest (§10.6), which
    # listens on the same container port.
    - ports:
        - port: 8080
          protocol: TCP

    # Allow OpenTelemetry OTLP/gRPC to the collector (platform-gincommon's
    # ObservabilityMiddlewares uses gRPC on 4317, not the legacy OTLP/HTTP
    # port 4318 some sibling services use).
    - ports:
        - port: 4317
          protocol: TCP

    # Allow the reconciler CronJobs (same pod labels) to push their metrics
    # to the Prometheus Pushgateway (PROMETHEUS_PUSHGATEWAY_URL) — they have
    # no /metrics listener, so without this every reconciler alert is dark.
    - ports:
        - port: {{ .Values.networkPolicy.pushgatewayPort }}
          protocol: TCP

    # Allow the Istio sidecar to reach istiod (xDS config + workload
    # certificates) whenever this chart uses the mesh: the server's
    # AuthorizationPolicy (commercialCallers.istio.enabled) or the reconciler
    # CronJobs' sidecar (cronjobMesh.istioInject). Without it a sidecar never
    # becomes ready, so mTLS calls (e.g. the reaper's TS-7) fail.
    {{- if or .Values.commercialCallers.istio.enabled .Values.cronjobMesh.istioInject }}
    - ports:
        - port: {{ .Values.networkPolicy.istiodPort }}
          protocol: TCP
    {{- end }}

    {{- with .Values.networkPolicy.additionalEgressRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
