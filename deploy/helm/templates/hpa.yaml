{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "iam-realm-provisioner.fullname" . }}
  labels:
    {{- include "iam-realm-provisioner.labels" . | nindent 4 }}
  {{- if .Values.autoscaling.targetRPSPerReplica }}
  annotations:
    # Scales on platform_http_requests_total, still "proposed" in the
    # Platform Observability Registry (awaiting governance ratification).
    observability.platform/metric-status: proposed
  {{- end }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "iam-realm-provisioner.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
    {{- if .Values.autoscaling.targetRPSPerReplica }}
    # RPS-based scaling: opt-in, off by default (§14 has no queue-depth/RPS
    # scaling requirement for this service). PREREQUISITE: prometheus-adapter
    # must be installed and configured with the rule at
    # deploy/monitoring/prometheus-adapter-rule.yaml. Without it this metric
    # is silently absent from the custom metrics API and the HPA falls back
    # to CPU/memory only. The adapter derives this from
    # platform_http_requests_total (metric_status: proposed).
    - type: Pods
      pods:
        metric:
          name: platform_http_requests_per_second
        target:
          type: AverageValue
          averageValue: {{ .Values.autoscaling.targetRPSPerReplica }}
    {{- end }}
{{- end }}
