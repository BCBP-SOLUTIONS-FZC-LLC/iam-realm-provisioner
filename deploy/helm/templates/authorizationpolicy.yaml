{{- if and .Values.commercialCallers.istio.enabled (or .Values.commercialCallers.enabled .Values.signupBffCaller.enabled) }}
{{- if not .Values.commercialCallers.istio.existingCallerNamespaces }}
{{- fail "commercialCallers.istio.existingCallerNamespaces is required when the Istio AuthorizationPolicy renders: it is an ALLOW policy, so every caller not listed (gateway, same-namespace IAM services, observability) would be denied." }}
{{- end }}
# Istio AuthorizationPolicy — CD-19: Commercial callers (Billing) on
# RP-3/RP-4/RP-11, and the Signup BFF on RP-1/RP-2 (BFF-1).
#
# This policy is rendered ONLY when commercialCallers.istio.enabled is true
# AND at least one of commercialCallers.enabled / signupBffCaller.enabled is. Keeping the two flags
# independent lets operators enable the L4 NetworkPolicy rule (enabled: true)
# on clusters that do not have Istio CRDs installed, without causing
# "no matches for kind AuthorizationPolicy" helm errors.
#
# Because action: ALLOW denies every request that matches no rule, this
# policy explicitly admits all namespaces that already have NetworkPolicy
# ingress access to the API port (existingCallerNamespaces) before adding the
# path-restricted rules. Without this list, iam-system callers (Core/O&M in
# the iam namespace), the Envoy Gateway proxy (gateway) and Prometheus
# (observability) would be silently denied the moment this policy is applied.
#
# Rules summary:
#   1. existingCallerNamespaces (e.g. iam, gateway) → all paths
#      (mirrors the NetworkPolicy same-namespace and ingressController rules)
#   2. billing namespace / commercial-billing SA → RP-3/RP-4/RP-11 only
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ include "iam-realm-provisioner.fullname" . }}-commercial-callers
  labels:
    {{- include "iam-realm-provisioner.labels" . | nindent 4 }}
  annotations:
    cd19: "commercial-system allow-list for Billing → RP-3/RP-4/RP-11"
spec:
  selector:
    matchLabels:
      {{- include "iam-realm-provisioner.selectorLabels" . | nindent 6 }}
  action: ALLOW
  rules:
    # ── Existing callers (rule 3 of the CD-19 alignment spec) ──────────────
    # Admit all principals from namespaces that already hold NetworkPolicy
    # ingress access on the API port (iam, gateway, etc.).
    # Path is unrestricted here — the NetworkPolicy already enforces L4.
    {{- range .Values.commercialCallers.istio.existingCallerNamespaces }}
    - from:
        - source:
            namespaces:
              - {{ . | quote }}
    {{- end }}

    {{- if .Values.commercialCallers.enabled }}
    # ── Billing → RP-3/RP-4/RP-11 (CD-19 path-restricted) ────────────────
    # Billing calls RP-3 (convert), RP-4 (revert-conversion), and RP-11
    # (realm / idp_count SSO-downgrade guard).  All other /internal/* routes
    # remain gated by RequireSystemRole (iam-system only); commercial-system
    # callers hitting those routes receive 403 insufficient_role from the
    # middleware defense-in-depth layer.
    - from:
        - source:
            principals:
              - "{{ .Values.commercialCallers.istio.trustDomain }}/ns/{{ .Values.commercialCallers.billingNamespace }}/sa/{{ .Values.commercialCallers.billingServiceAccount }}"
      to:
        - operation:
            methods: ["POST"]
            paths:
              - "*/convert"
              - "*/revert-conversion"
        - operation:
            methods: ["GET"]
            paths:
              - "*/realm"
    {{- end }}
    {{- if .Values.signupBffCaller.enabled }}
    # ── Signup BFF → RP-1/RP-2 (BFF-1, pod-level) ─────────────────────────
    # Admitted by principal, not namespace, so no other workload in bff is
    # granted anything.
    - from:
        - source:
            principals:
              - "{{ .Values.commercialCallers.istio.trustDomain }}/ns/{{ .Values.signupBffCaller.namespace }}/sa/{{ .Values.signupBffCaller.serviceAccountName }}"
      to:
        - operation:
            methods: ["POST"]
            paths:
              - "/api/v1/internal/tenants/provision-trial"
              - "/api/v1/internal/tenants/provision-direct"
    {{- end }}
{{- end }}
