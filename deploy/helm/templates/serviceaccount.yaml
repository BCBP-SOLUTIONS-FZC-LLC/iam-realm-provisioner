{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "iam-realm-provisioner.serviceAccountName" . }}
  labels:
    {{- include "iam-realm-provisioner.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Unlike a sibling service with no OpenBao dependency, this ServiceAccount's
# projected token IS actively used at runtime: the OpenBao adapter
# (internal/adapter/outbound/openbao/) reads the pod's own
# /var/run/secrets/kubernetes.io/serviceaccount/token to authenticate
# against OpenBao's Kubernetes auth method (BAO_AUTH_ROLE) — so the default
# token must stay automounted.
automountServiceAccountToken: true
{{- end }}
