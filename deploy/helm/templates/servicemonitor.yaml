{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "iam-realm-provisioner.fullname" . }}
  labels:
    {{- include "iam-realm-provisioner.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "iam-realm-provisioner.selectorLabels" . | nindent 6 }}
  endpoints:
    # Metrics are served on the dedicated "metrics" port (9090), separate
    # from the "http" API port — scraping never touches the API surface.
    # Covers the iam_realm_provisioner_* (Tier 3) business metrics (§14),
    # platform_dependency_request_seconds{dependency="keycloak"} (this
    # service), and the Tier 1 platform_http_* / platform_messages_* /
    # platform_outbox_* / platform_db_* metrics platform-gincommon,
    # platform-events and platform-pgcommon emit — all labeled
    # {domain, service, environment}.
    - port: metrics
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      {{- with .Values.serviceMonitor.relabelings }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- with .Values.serviceMonitor.namespaceSelector }}
  namespaceSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
