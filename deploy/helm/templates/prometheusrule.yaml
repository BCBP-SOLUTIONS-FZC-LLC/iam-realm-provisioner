{{- /*
This PrometheusRule is the Helm-rendered twin of deploy/monitoring/app-alerts.yml
(that file's own header comment names this exact relationship). Keep every
alert name, expression, threshold, and duration identical between the two —
only the job/service label's literal "iam-realm-provisioner" here becomes
the chart's fullname template (they coincide under the default release
name). If you add or change an alert, update BOTH files.
*/ -}}
{{- if .Values.serviceMonitor.enabled }}
{{- $job := include "iam-realm-provisioner.fullname" . }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "iam-realm-provisioner.fullname" . }}
  labels:
    {{- include "iam-realm-provisioner.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: iam_realm_provisioner_availability
      rules:

        # ── Service down ────────────────────────────────────────────────
        - alert: IAMRealmProvisionerDown
          expr: |
            absent(up{job={{ $job | quote }}} == 1)
          for: 2m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: iam-realm-provisioner has no healthy instances
            description: >-
              No iam-realm-provisioner pods have been scraped as healthy for 2
              minutes. Check pod readiness:
              kubectl get pods -l app.kubernetes.io/name=iam-realm-provisioner
              — this blocks all RP-1..RP-16 endpoints and the three SQS
              consumers; the reconciler CronJobs (RP-C1..RP-C4) run as
              separate pods and are not covered by this alert.

        # ── Pod count below minimum ─────────────────────────────────────
        - alert: IAMRealmProvisionerReplicasMissing
          expr: |
            sum(up{job={{ $job | quote }}}) < {{ .Values.autoscaling.minReplicas }}
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: iam-realm-provisioner running below minimum replica count
            description: >-
              Fewer than {{ .Values.autoscaling.minReplicas }} replicas are healthy. Current healthy count: {{ "{{ $value }}" }}.

    - name: iam_realm_provisioner_errors
      rules:

        # ── HTTP 5xx error rate ───────────────────────────────────────────
        - alert: IAMRealmProvisionerHighErrorRate
          expr: |
            sum(rate(http_requests_total{job={{ $job | quote }}, status=~"5.."}[5m]))
              /
            sum(rate(http_requests_total{job={{ $job | quote }}}[5m]))
            > 0.05
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: iam-realm-provisioner 5xx error rate above 5%
            description: >-
              {{ "{{ $value | humanizePercentage }}" }} of requests are returning 5xx errors
              over the last 5 minutes. Check Postgres/Keycloak/OpenBao/O&M
              dependency health and application logs.

        # ── HTTP 5xx error rate — critical ────────────────────────────────
        - alert: IAMRealmProvisionerCriticalErrorRate
          expr: |
            sum(rate(http_requests_total{job={{ $job | quote }}, status=~"5.."}[5m]))
              /
            sum(rate(http_requests_total{job={{ $job | quote }}}[5m]))
            > 0.20
          for: 2m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: iam-realm-provisioner 5xx error rate above 20%
            description: >-
              {{ "{{ $value | humanizePercentage }}" }} of requests are returning 5xx errors.
              This exceeds the critical threshold. Escalate immediately —
              RP-INV-1's single Keycloak writer means every tenant realm
              operation funnels through this one service.

        # ── Keycloak Admin API failure rate (§11.5) ───────────────────────
        - alert: IAMRealmProvisionerKeycloakCallFailureRate
          expr: |
            sum(rate(iam_realm_provisioner_keycloak_call_failures_total{job={{ $job | quote }}}[5m]))
              /
            sum(rate(iam_realm_provisioner_keycloak_call_duration_seconds_count{job={{ $job | quote }}}[5m]))
            > 0.05
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: iam-realm-provisioner Keycloak Admin API failure rate above 5%
            description: >-
              {{ "{{ $value | humanizePercentage }}" }} of Keycloak Admin API calls are
              failing over the last 5 minutes, broken down by operation in
              iam_realm_provisioner_keycloak_call_failures_total{op}. Check
              Keycloak health and admin credential validity.

        # ── Admin token refresh spike on 401 (possible credential rotation) ─
        - alert: IAMRealmProvisionerAdminTokenRefresh401Spike
          expr: |
            increase(iam_realm_provisioner_admin_token_refresh_total{job={{ $job | quote }}, trigger="401"}[15m]) > 3
          labels:
            severity: warning
            team: platform
          annotations:
            summary: iam-realm-provisioner admin token is being reactively refreshed on 401s
            description: >-
              {{ "{{ $value | humanize }}" }} reactive (401-triggered) admin token
              refreshes in the last 15 minutes — proactive refresh
              (trigger="proactive") should normally prevent this. Possible
              Keycloak credential rotation, clock skew, or token-cache bug.

    - name: iam_realm_provisioner_latency
      rules:

        # ── p99 request latency ───────────────────────────────────────────
        - alert: IAMRealmProvisionerHighLatency
          expr: |
            histogram_quantile(0.99,
              sum by (le) (
                rate(http_request_duration_seconds_bucket{job={{ $job | quote }}}[5m])
              )
            ) > 1
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: iam-realm-provisioner p99 latency above 1s
            description: >-
              The p99 request duration is {{ "{{ $value | humanizeDuration }}" }}.
              Multi-step Keycloak provisioning flows (RP-2/RP-3) are the
              likeliest cause — check
              iam_realm_provisioner_keycloak_call_duration_seconds{op} for the
              slow operation.

    - name: iam_realm_provisioner_lifecycle
      rules:

        # ── RP-C1 trial-expiry deferrals sustained (§11.5) ────────────────
        - alert: IAMRealmProvisionerTrialExpiryDeferredSustained
          expr: |
            increase(iam_realm_provisioner_trial_expiry_deferred_total{job={{ $job | quote }}}[1h]) > 0
          for: 1h
          labels:
            severity: warning
            team: platform
          annotations:
            summary: iam-realm-provisioner trial-expiry reconciler is deferring rows
            description: >-
              The trial-expiry CronJob (RP-C1) has been deferring rows to the
              next tick for at least 1 hour. Trials that should have expired
              are staying active past trial_ends_at. Check reconciler logs and
              Keycloak health.

        # ── RP-C4 realm-config reconciliation pending sustained (§11.5) ────
        - alert: IAMRealmProvisionerRealmConfigPendingSustained
          expr: |
            iam_realm_provisioner_realm_config_pending_gauge{job={{ $job | quote }}} > 0
          for: 30m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: iam-realm-provisioner has realm-config changes stuck pending
            description: >-
              {{ "{{ $value | humanize }}" }} realm_config_reconciliations row(s) have
              been in status=pending for at least 30 minutes (local-intent-
              first pattern, RP-10/RP-C4). The desired realm setting has not
              yet been applied to Keycloak. Check Keycloak connectivity.

        # ── RP-11 realm export failure — critical (§11.5) ─────────────────
        - alert: IAMRealmProvisionerRealmExportFailure
          expr: |
            increase(iam_realm_provisioner_realm_export_total{job={{ $job | quote }}, result="fail"}[15m]) > 0
          labels:
            severity: critical
            team: platform
          annotations:
            summary: iam-realm-provisioner failed to export a realm before offboarding
            description: >-
              {{ "{{ $value | humanize }}" }} realm export(s) to S3 failed in the last
              15 minutes (RP-11/RP-EVT-4 — offboarding cannot proceed to
              delete without a durable export). Investigate immediately: an
              un-exported tenant realm blocks its own offboarding.

    - name: iam_realm_provisioner_outbox_and_queues
      rules:

        # ── Transactional outbox dead-letters (§11.5) — outbox_dead_letters_total
        #    is platform-events' own metric (registered automatically by
        #    events.Init), not something this service defines itself. Mirrors
        #    the sibling IAM services' identical outbox-stuck alert — keep in
        #    sync with deploy/monitoring/app-alerts.yml.
        - alert: IAMRealmProvisionerOutboxStuck
          expr: |
            increase(outbox_dead_letters_total{service={{ $job | quote }}}[30m]) > 0
          for: 15m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: iam-realm-provisioner outbox events moved to the dead-letter table
            description: >-
              One or more produced tenant-lifecycle events (TrialTenantProvisioned,
              TenantRealmReady, TenantConverted, etc.) exhausted MaxAttempts and
              were moved to outbox_dead_letters. Check the outbox runner logs
              for SNS publish errors and verify SNS_TOPIC_TENANT_ARN
              connectivity; outbox_dead_letters is queryable/retryable via
              standard SQL.

        # ── SQS ReceiveMessage errors — an application-visible signal that a
        #    consumer loop can't reach its queue at all ────────────────────
        - alert: IAMRealmProvisionerSQSReceiveErrors
          expr: |
            increase(sqs_receive_errors_total{service={{ $job | quote }}}[30m]) > 0
          labels:
            severity: warning
            team: platform
          annotations:
            summary: iam-realm-provisioner is failing to receive from an inbound queue
            description: >-
              {{ "{{ $value | humanize }}" }} SQS ReceiveMessage error(s) on
              {{ "{{ $labels.queue }}" }} in the last 30 minutes (excludes context
              cancellation). Check IAM permissions and queue connectivity for
              membership-realm-q / tenant-realm-q / billing-realm-q.

        # ── Inbound SQS DLQ depth (§11.5: "{membership,billing,tenant}-realm-q
        #    DLQ depth > 0 — warning"). NOTE: no application-level DLQ-depth
        #    metric exists in this codebase — this alert is written against
        #    the platform's CloudWatch exporter
        #    (aws_sqs_approximate_number_of_messages_visible_average), an
        #    ASSUMPTION about the shared exporter deployment, not pinned in
        #    this service's own code or LLD. Confirm before relying on it.
        - alert: IAMRealmProvisionerInboundDLQDepth
          expr: |
            aws_sqs_approximate_number_of_messages_visible_average{queue_name=~"(membership|tenant|billing)-realm-q-dlq"} > 0
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "iam-realm-provisioner: messages stuck on {{ "{{ $labels.queue_name }}" }}"
            description: >-
              {{ "{{ $value | humanize }}" }} message(s) visible on
              {{ "{{ $labels.queue_name }}" }} (maxReceiveCount=5 exhausted on the
              source queue). Inspect the DLQ — a malformed envelope or a
              persistent handler error needs manual replay/fix.

        # ── Forward-compat signal (ticket) — matching iam-org-membership ──
        - alert: IAMRealmProvisionerUnknownEventType
          expr: |
            rate(iam_realm_provisioner_unknown_event_acknowledged_total[10m]) > 0
          for: 30m
          labels:
            severity: ticket
            team: platform
          annotations:
            summary: "A producer is emitting an event type this consumer doesn't handle"
            description: >-
              iam-realm-provisioner is silently ack'ing events of type
              {{ "{{ $labels.event_type }}" }} on topic
              {{ "{{ $labels.topic }}" }} (recorded in processed_events).
              This is forward-compat behavior, but the producer has added a
              type we should be handling.

    - name: iam_realm_provisioner_tenant_isolation
      rules:

        # ── RLS-6 cross-tenant access (§17.5 Case 5) ──────────────────────
        - alert: IAMRealmProvisionerRLSCrossTenantAccess
          # cross_tenant_access means a valid app.tenant_id GUC pointed at a
          # row belonging to a different tenant — either a real attack or a
          # serious application bug. No `for` clause: one occurrence pages.
          expr: |
            increase(iam_realm_provisioner_rls_violations_total{violation_type="cross_tenant_access"}[5m]) > 0
          labels:
            severity: critical
            team: platform
            compliance: tenant-isolation
          annotations:
            summary: RLS blocked a cross-tenant access attempt
            description: >-
              A caller with a valid tenant GUC attempted to read/write a row
              belonging to a different tenant. Investigate the last 5 minutes
              of rls_violation_log for row_tenant_id, app_tenant_id,
              session_role, client_addr, and query_text. This alert has no
              `for` clause — one occurrence is enough to page.

        # ── RLS-6 missing/invalid GUC (§17.5 Case 5) ──────────────────────
        - alert: IAMRealmProvisionerRLSMissingGUC
          expr: |
            rate(iam_realm_provisioner_rls_violations_total{violation_type="missing_or_invalid_guc"}[5m]) > 0
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: RLS violations from missing or invalid tenant GUC
            description: >-
              Sustained rate of missing_or_invalid_guc violations over 10m.
              A caller path is not binding app.tenant_id via SET LOCAL
              (RLS-6) before touching a tenant-scoped table. Check
              GUCBridgeMiddleware wiring for the HTTP path, or the
              SysPool/RLS-scoped pool choice for a reconciler/consumer path.
{{- end }}
