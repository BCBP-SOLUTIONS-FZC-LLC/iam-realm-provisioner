# Prometheus Adapter ConfigMap — maps Prometheus metrics to the Custom Metrics API
# so the HPA can scale on platform_http_requests_per_second (see values.yaml's
# autoscaling.targetRPSPerReplica, unset/0 by default — this service's write
# volume is driven by tenant lifecycle events (signup/conversion/trial
# expiry), not sustained high RPS, so CPU/memory scaling is the default;
# enable this only if RP-1/RP-4 traffic justifies RPS-based scaling in a
# given deployment).
#
# Deploy into the namespace where prometheus-adapter runs (typically kube-system
# or observability). This rule fragment is generic (matches any service's
# platform_http_requests_total) — merge with any existing prometheus-adapter
# ConfigMap rather than replacing it; every gincommon-based IAM service shares
# this same fragment.
#
# platform_http_requests_total is platform-gincommon's Tier 1 successor of the
# removed unprefixed name; its Platform Observability Registry status is
# still "proposed" (metric_status: proposed — awaiting governance
# ratification). The exposed custom metric was renamed with it, so the HPA
# (templates/hpa.yaml) references platform_http_requests_per_second.
#
# Reference:
#   https://github.com/kubernetes-sigs/prometheus-adapter/blob/master/docs/config.md
#
# After applying, verify the metric is visible:
#   kubectl get --raw /apis/custom.metrics.k8s.io/v1beta1 | jq '.resources[].name' | grep rps
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-adapter-config
  namespace: observability   # adjust to match your prometheus-adapter deployment namespace
  labels:
    app.kubernetes.io/name: prometheus-adapter
    app.kubernetes.io/component: metrics
data:
  config.yaml: |
    rules:
      # Expose per-pod RPS as platform_http_requests_per_second so the HPA can
      # use type: Pods / metric: platform_http_requests_per_second.
      # Computed from the Prometheus counter platform_http_requests_total
      # scraped by the ServiceMonitor (serviceMonitor.enabled: true in Helm
      # values). metric_status: proposed.
      - seriesQuery: 'platform_http_requests_total{namespace!="",pod!=""}'
        resources:
          overrides:
            namespace:
              resource: namespace
            pod:
              resource: pod
        name:
          matches: "^(.*)_total$"
          as: "${1}_per_second"
        metricsQuery: 'sum(rate(<<.Series>>{<<.LabelMatchers>>}[2m])) by (<<.GroupBy>>)'
