# LocalStack Pro stack — standalone (not an override of docker-compose.yml).
# Same Postgres + Keycloak + OpenBao as the community stack, but LocalStack
# runs the Pro image so Glue Schema Registry and KMS are available.
# Requires a valid LOCALSTACK_AUTH_TOKEN (set in .env or exported).
#
#   LOCALSTACK_AUTH_TOKEN=<your-token> docker compose -f docker-compose.pro.yml up
#
# With Pro:
#   - Glue Schema Registry: set GLUE_REGISTRY_TENANT_NAME in .env to activate
#     GlueCodec (the 9 event schemas in internal/eventschema/ are mounted and
#     registered automatically on container start)
#   - KMS: S3 realm-export objects encrypted server-side (REALM_EXPORT_KMS_KEY)
#   - All other services (S3, SNS, SQS, Postgres, Keycloak, OpenBao) are
#     identical to docker-compose.yml (community edition) — this file
#     duplicates them rather than overriding, so it runs standalone without
#     `-f docker-compose.yml`.
services:
  app:
    build:
      context: .
      secrets:
        - go_private_token
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      APP_ENV: dev
      GLUE_REGISTRY_TENANT_NAME: ${GLUE_REGISTRY_TENANT_NAME:-iam-tenant-events}
      REALM_EXPORT_KMS_KEY: ${REALM_EXPORT_KMS_KEY:-}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      openbao:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5544:5432"
    volumes:
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack-pro:latest
    ports:
      - "4571:4566"
    environment:
      SERVICES: sns,sqs,s3,glue,kms
      DEBUG: 0
      AWS_DEFAULT_REGION: ap-south-1
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN}
    volumes:
      - ./scripts/init-localstack.sh:/etc/localstack/init/ready.d/init-localstack.sh:ro
      - ./internal/eventschema:/etc/localstack/init/schemas:ro
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Keycloak: dev-mode, single node, backed by its own embedded dev-file
  # store — NOT for production use (production Keycloak is externally
  # managed per HLD §4.2/§4.3). Identical to docker-compose.yml's block;
  # duplicated here (not overridden) so this file runs standalone.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8091:8080"
    healthcheck:
      # The Keycloak image ships neither curl nor wget; a bash /dev/tcp
      # connect check is the lowest-common-denominator liveness probe that
      # works without Quarkus health endpoints enabled (dev mode default).
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # OpenBao: dev-server mode (in-memory, auto-unsealed, KV v2 already
  # mounted at "secret/" by default) — NOT for production use (production
  # OpenBao is externally managed, credentials via Kubernetes auth only,
  # never env/image/git, §12/§20). The container prints its dev root token
  # to stdout on startup (`docker compose logs openbao`); no Kubernetes
  # cluster exists in this compose stack, so BAO_AUTH_ROLE's Kubernetes-auth
  # login this service performs at runtime will not actually succeed here —
  # local `make run` dev work that needs a live IdP-secret round trip must
  # seed OpenBao by hand (`bao login <root token>` against this container)
  # rather than relying on this stack alone; test/integration/openbao_test.go
  # is what exercises the real Kubernetes-auth login end to end. Identical
  # to docker-compose.yml's block; duplicated here so this file runs
  # standalone.
  openbao:
    image: openbao/openbao:latest
    command: ["server", "-dev"]
    ports:
      - "8210:8200"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
  localstack-data:

secrets:
  go_private_token:
    environment: GO_PRIVATE_TOKEN
