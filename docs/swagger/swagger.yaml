basePath: /api/v1/internal
definitions:
  http.ErrorResponse:
    properties:
      details:
        additionalProperties: {}
        type: object
      error:
        type: string
      request_id:
        type: string
      status:
        type: integer
      trace_id:
        type: string
    type: object
  http.applyRealmConfigRequest:
    properties:
      desired_value: {}
      setting_key:
        maxLength: 128
        type: string
    required:
    - setting_key
    type: object
  http.configureIdpRequest:
    properties:
      ack:
        items:
          type: string
        maxItems: 20
        type: array
      config:
        additionalProperties: {}
        type: object
      display_name:
        maxLength: 256
        type: string
      idp_alias:
        maxLength: 128
        type: string
      protocol:
        maxLength: 16
        type: string
      secret:
        description: |-
          Secret can be a SAML signing certificate or RSA private key in PEM
          form (legitimately several KB) — bounded generously, well below the
          global request-body cap, not to the size of a typical OIDC client secret.
        maxLength: 8192
        type: string
    required:
    - display_name
    - idp_alias
    - protocol
    type: object
  http.convertRequest:
    properties:
      billing_subscription_id:
        maxLength: 128
        type: string
      payment_method_id:
        description: ignored — Billing/PCI domain, §5.2.1
        maxLength: 128
        type: string
      plan:
        maxLength: 32
        type: string
    required:
    - plan
    type: object
  http.createInvitedUserRequest:
    properties:
      email:
        maxLength: 254
        type: string
      full_name:
        maxLength: 256
        type: string
      required_actions:
        items:
          type: string
        maxItems: 10
        type: array
    required:
    - email
    - full_name
    type: object
  http.provisionDirectRequest:
    properties:
      admin_email:
        maxLength: 254
        type: string
      admin_name:
        maxLength: 256
        type: string
      billing_subscription_id:
        maxLength: 128
        type: string
      hashed_password_seed:
        maxLength: 512
        type: string
      plan:
        maxLength: 32
        type: string
      tenant_id:
        type: string
      tenant_name:
        maxLength: 256
        type: string
      tenant_slug:
        maxLength: 63
        type: string
    required:
    - admin_email
    - admin_name
    - plan
    - tenant_id
    - tenant_name
    - tenant_slug
    type: object
  http.provisionTrialRequest:
    properties:
      admin_email:
        maxLength: 254
        type: string
      admin_name:
        maxLength: 256
        type: string
      hashed_password_seed:
        maxLength: 512
        type: string
      plan:
        maxLength: 32
        type: string
      tenant_id:
        type: string
      tenant_name:
        maxLength: 256
        type: string
      tenant_slug:
        maxLength: 63
        type: string
    required:
    - admin_email
    - admin_name
    - plan
    - tenant_id
    - tenant_name
    - tenant_slug
    type: object
  http.reactivateRequest:
    properties:
      reason:
        type: string
    type: object
  http.revertConversionRequest:
    properties:
      reason:
        type: string
    type: object
  http.suspendRequest:
    properties:
      reason:
        maxLength: 500
        type: string
    required:
    - reason
    type: object
  service.ApplyRealmConfigResult:
    properties:
      applied:
        type: boolean
      reconciling:
        type: boolean
    type: object
  service.ConfigureIdpResult:
    properties:
      idp_alias:
        type: string
      status:
        type: string
    type: object
  service.ConvertResult:
    properties:
      keycloak_shard:
        type: string
      oidc_clients:
        items:
          type: string
        type: array
      realm:
        type: string
      shared_sessions_terminated:
        type: boolean
      strategy:
        type: string
      tenant_id:
        type: string
      users_migrated:
        type: integer
      webauthn_reenroll_required:
        type: integer
    type: object
  service.CreateInvitedUserResult:
    properties:
      keycloak_user_id:
        type: string
    type: object
  service.ExpireTrialResult:
    properties:
      grace_ends_at:
        type: string
      tenant_id:
        type: string
      trial_ends_at:
        type: string
    type: object
  service.GetRealmResult:
    properties:
      idp_count:
        description: |-
          IdpCount is the number of active SAML/OIDC IdP configurations for the
          tenant (status='active' only; disabled and pending_validation excluded).
          Always 0 for shared-strategy (trial) tenants — RP-6 blocks IdP
          configuration on the shared realm (409 idp_requires_dedicated_realm).
        type: integer
      keycloak_shard:
        type: string
      realm_name:
        type: string
      record_version:
        type: integer
      status:
        type: string
      strategy:
        type: string
      tenant_id:
        type: string
    type: object
  service.PortabilityAuditResult:
    properties:
      failing:
        type: integer
      failing_tenants:
        items:
          type: string
        type: array
      passing:
        type: integer
      total_idp_configs:
        type: integer
      total_tenants:
        type: integer
      warnings_only:
        type: integer
    type: object
  service.ProvisionDirectResult:
    properties:
      keycloak_shard:
        type: string
      oidc_clients:
        items:
          type: string
        type: array
      realm:
        type: string
      strategy:
        type: string
      tenant_id:
        type: string
    type: object
  service.ProvisionTrialResult:
    properties:
      email_verification_sent:
        type: boolean
      keycloak_user_id:
        type: string
      realm:
        type: string
      strategy:
        type: string
      tenant_id:
        type: string
    type: object
  service.ReactivateResult:
    properties:
      status:
        type: string
      tenant_id:
        type: string
    type: object
  service.RevertConversionResult:
    properties:
      realm:
        type: string
      strategy:
        type: string
      tenant_id:
        type: string
    type: object
  service.SuspendResult:
    properties:
      status:
        type: string
      tenant_id:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: sharmila.dayalan@bcbpsolutions.com
    name: BCBP Solutions
  description: |-
    Realm Provisioner microservice — sole writer to the Keycloak Admin API and system of record for tenant identity lifecycle (trial → active → suspended → offboarded).

    **Tenant isolation:** All resource access is strictly scoped by x-tenant-id. Cross-tenant access is never permitted.
    **Idempotency:** Every mutating endpoint requires an `Idempotency-Key` header. Resubmitting a completed key replays the stored result without re-executing.
  license:
    name: Proprietary
  title: IAM Realm Provisioner API
  version: "1.0"
paths:
  /audit/idp-region-portability:
    post:
      description: Operator-only. Runs the §11.6 Region-Agnostic IdP Configuration
        Checklist across every tenant with an active IdP configuration and returns
        a per-tenant validation report. Not tenant-scoped — scans the full estate.
        Used for pre-migration and compliance audits.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.PortabilityAuditResult'
        "403":
          description: insufficient_role (operator role required)
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - SystemRole: []
      summary: RP-13 — Whole-estate IdP region-portability audit (operator-only)
      tags:
      - IdP
  /tenants/{id}/convert:
    post:
      consumes:
      - application/json
      description: 'Migrates users from the shared trial realm to a new dedicated
        realm, preserving Keycloak sub UUIDs. TOTP credentials are copied; WebAuthn
        requires re-enrolment. Idempotent on Idempotency-Key reuse. Named callers:
        Billing (commercial-system principal, CD-19 allow-list — drives the conversion
        saga after Stripe confirms payment), Signup BFF (iam-system). Audit actor:
        the caller''s principal is logged (commercial-system or iam-system).'
      parameters:
      - description: Tenant UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Conversion payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.convertRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.ConvertResult'
        "400":
          description: invalid_request OR missing_idempotency_key
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: insufficient_role (caller not in CD-19 allow-list)
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: tenant_realm_not_found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "409":
          description: operation_in_progress OR realm_already_dedicated OR tenant_offboarded
            OR optimistic_lock_conflict OR credential_replay_expired
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "502":
          description: conversion_failed
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "503":
          description: db_unavailable OR keycloak_unavailable OR token_service_unavailable
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - SystemRole: []
      - TenantID: []
      - IdempotencyKey: []
      summary: RP-3 — Convert trial tenant to dedicated realm
      tags:
      - Provisioning
  /tenants/{id}/expire-trial:
    post:
      description: Transitions a trial tenant to expired/disabled status after the
        grace period. Called by the RP-C1 reconciler CronJob; not intended for direct
        operator use. Disables the Keycloak realm and records the expiry timestamp.
        Idempotent on Idempotency-Key reuse.
      parameters:
      - description: Tenant UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.ExpireTrialResult'
        "400":
          description: invalid_request OR missing_idempotency_key
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: tenant_realm_not_found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "409":
          description: operation_in_progress OR realm_already_dedicated OR tenant_offboarded
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - SystemRole: []
      - TenantID: []
      - IdempotencyKey: []
      summary: RP-12 — Expire trial tenant
      tags:
      - Lifecycle
  /tenants/{id}/idp:
    put:
      consumes:
      - application/json
      description: 'Creates or replaces the tenant''s identity provider in Keycloak.
        The IdP client secret is stored exclusively in OpenBao — never in Postgres.
        Runs the §11.6 region-portability validation gate before writing: CRITICAL
        failures return 409; unacknowledged WARN checks return 422 until the caller
        supplies the required ack codes in the `ack` field. Idempotent on Idempotency-Key
        reuse.'
      parameters:
      - description: Tenant UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: IdP configuration payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.configureIdpRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.ConfigureIdpResult'
        "400":
          description: invalid_request OR missing_idempotency_key OR invalid_idp_protocol
            OR idp_region_portability_failed
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: tenant_realm_not_found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "409":
          description: operation_in_progress OR idp_requires_dedicated_realm OR optimistic_lock_conflict
            OR tenant_offboarded
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "422":
          description: idp_warnings_unacknowledged
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - SystemRole: []
      - TenantID: []
      - IdempotencyKey: []
      summary: RP-6 — Configure tenant IdP (SAML/OIDC)
      tags:
      - IdP
  /tenants/{id}/idp/{alias}:
    delete:
      description: 'Deletes the specified identity provider from the tenant''s Keycloak
        realm and removes the client secret from OpenBao. Idempotent: deleting an
        already-absent IdP returns 204.'
      parameters:
      - description: Tenant UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: IdP alias
        in: path
        name: alias
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: invalid_request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: tenant_realm_not_found OR idp_config_not_found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - SystemRole: []
      - TenantID: []
      summary: RP-7 — Remove tenant IdP
      tags:
      - IdP
  /tenants/{id}/reactivate:
    post:
      consumes:
      - application/json
      description: Reverses both a billing-lapse suspension and an operator (RP-14)
        suspension from one endpoint. Re-enables the Keycloak realm and clears the
        suspended status. Body is optional; reason is informational only. Idempotent
        on Idempotency-Key reuse.
      parameters:
      - description: Tenant UUID
        format: uuid
        in: path
        name: id
        type: string
      - description: Optional reactivation reason
        in: body
        name: request
        schema:
          $ref: '#/definitions/http.reactivateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.ReactivateResult'
        "400":
          description: invalid_request OR missing_idempotency_key
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: tenant_realm_not_found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "409":
          description: operation_in_progress OR tenant_offboarded OR optimistic_lock_conflict
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - SystemRole: []
      - TenantID: []
      - IdempotencyKey: []
      summary: RP-10 — Reactivate suspended tenant realm
      tags:
      - Lifecycle
  /tenants/{id}/realm:
    get:
      description: 'Returns the tenant''s current realm record: realm name, strategy
        (shared/dedicated), lifecycle status, Keycloak shard, record_version, and
        idp_count. idp_count is the number of active (status=active) SAML/OIDC IdP
        configurations — excludes disabled and pending_validation. idp_count is always
        0 for shared-strategy (trial) tenants (RP-6 blocks IdP configuration there).
        On IdP repository failure the endpoint returns 503 db_unavailable or 503 request_timeout
        — never a silent 0 that could permit an SSO-losing plan downgrade (CD-20).
        Named callers: Core (iam-org-membership, iam-system principal, I-18 plan-change-check
        — reads idp_count to block an SSO-losing plan downgrade, CD-20), Billing (commercial-system
        principal, CD-19 allow-list — interim SSO guard), Signup BFF, Org & Membership
        (both iam-system). CD-19 NetworkPolicy and mesh AuthorizationPolicy (billing
        namespace → this route) are implemented in deploy/helm/templates/. Read-only;
        no side effects.'
      parameters:
      - description: Tenant UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.GetRealmResult'
        "400":
          description: invalid_request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: tenant_realm_not_found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "503":
          description: db_unavailable or request_timeout (IdP count query failed —
            never returns silent zero)
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - SystemRole: []
      - TenantID: []
      summary: RP-11 — Get realm info including active IdP count
      tags:
      - Lifecycle
  /tenants/{id}/realm-config:
    patch:
      consumes:
      - application/json
      description: 'Applies a single realm configuration key/value to the tenant''s
        Keycloak realm. Local-intent-first (RP-INV-6): if Keycloak is transiently
        unreachable the desired value is persisted as `pending` in realm_config_reconciliations
        and the caller receives 202 Accepted with `applied:false, reconciling:true`.
        RP-C4 converges it later. A 200 with `applied:true` means the change is live
        in Keycloak.'
      parameters:
      - description: Tenant UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Realm config setting
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.applyRealmConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Applied immediately
          schema:
            $ref: '#/definitions/service.ApplyRealmConfigResult'
        "202":
          description: Queued for reconciliation (applied:false)
          schema:
            $ref: '#/definitions/service.ApplyRealmConfigResult'
        "400":
          description: invalid_request OR unsupported_realm_setting
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: tenant_realm_not_found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - SystemRole: []
      - TenantID: []
      summary: RP-8 — Apply realm configuration setting
      tags:
      - RealmConfig
  /tenants/{id}/revert-conversion:
    post:
      consumes:
      - application/json
      description: 'Rolls back a conversion within the 7-day revert window. Migrates
        users back to the shared trial realm and deletes the dedicated realm. Named
        callers: Billing (commercial-system principal, CD-19 allow-list — on fraud/chargeback
        dispute; which Stripe signal triggers the call is a Billing-side decision,
        CD-10). 7-day window is enforced for ALL callers including commercial-system
        (409 revert_window_expired). Audit actor: the caller''s principal is logged.
        Body is optional; reason is informational only.'
      parameters:
      - description: Tenant UUID
        format: uuid
        in: path
        name: id
        type: string
      - description: Optional revert reason
        in: body
        name: request
        schema:
          $ref: '#/definitions/http.revertConversionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.RevertConversionResult'
        "400":
          description: invalid_request OR missing_idempotency_key
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: tenant_realm_not_found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "409":
          description: operation_in_progress OR revert_window_expired
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "503":
          description: db_unavailable OR keycloak_unavailable OR token_service_unavailable
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - SystemRole: []
      - TenantID: []
      - IdempotencyKey: []
      summary: RP-4 — Revert trial-to-dedicated conversion
      tags:
      - Provisioning
  /tenants/{id}/service-account/keys/refresh:
    post:
      description: 'Clears the tenant''s realm-scoped Keycloak keys cache so a just-issued/rotated
        credential is recognized and a just-revoked one stops authenticating (EXT-6,
        §2.5) — Keycloak''s jwks.url client-jwt authenticator does not self-refresh.
        No Keycloak-side apply happens at mint time (RP-1/RP-2/RP-3): Keycloak fetches
        the JWKS lazily on first use. No Idempotency-Key: clearing an already-fresh
        cache is a harmless no-op. Fail-closed on Keycloak-unreachable.'
      parameters:
      - description: Tenant UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: tenant_realm_not_found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "422":
          description: service_account_not_provisioned
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "502":
          description: keycloak_unavailable
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - SystemRole: []
      - TenantID: []
      summary: RP-17 — Refresh a service-account's Keycloak key cache
      tags:
      - ServiceAccount
  /tenants/{id}/suspend:
    post:
      consumes:
      - application/json
      description: Operator-only. Immediately disables the tenant's Keycloak realm
        and transitions status to suspended. Reason is required for the audit trail.
        Reversed by RP-10 Reactivate. Idempotent on Idempotency-Key reuse.
      parameters:
      - description: Tenant UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Suspension reason (required)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.suspendRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.SuspendResult'
        "400":
          description: invalid_request OR missing_idempotency_key
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: insufficient_role (operator role required)
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: tenant_realm_not_found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "409":
          description: operation_in_progress OR tenant_offboarded
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - SystemRole: []
      - TenantID: []
      - IdempotencyKey: []
      summary: RP-14 — Emergency operator suspension
      tags:
      - Lifecycle
  /tenants/{id}/users:
    post:
      consumes:
      - application/json
      description: Creates a Keycloak user in the tenant's realm for an accepted invitation.
        Sets required_actions (e.g. VERIFY_EMAIL, UPDATE_PASSWORD). Idempotent on
        Idempotency-Key reuse.
      parameters:
      - description: Tenant UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Invited user payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.createInvitedUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/service.CreateInvitedUserResult'
        "400":
          description: invalid_request OR missing_idempotency_key
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: tenant_realm_not_found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "409":
          description: operation_in_progress OR user_email_conflict
