securityDefinitions:
  IdempotencyKey:
    description: Caller-supplied UUID v4. Required on all mutating endpoints. Reusing
      a key for a completed operation replays the stored result.
    in: header
    name: Idempotency-Key
    type: apiKey
  SystemRole:
    description: Must contain "iam-system". Injected by the API gateway / mesh; never
      set by callers directly.
    in: header
    name: x-tenant-roles
    type: apiKey
  TenantID:
    description: Tenant UUID injected by the API gateway.
    in: header
    name: x-tenant-id
    type: apiKey
swagger: "2.0"
